openapi: 3.1.0
info:
  title: DeckHand API
  version: "1"
  summary: Local REST and WebSocket API for the DeckHand DJ application.
  description: |
    Everything DeckHand can do is reachable here; the UI is just a client. Bodies and replies are JSON
    (`application/json; charset=utf-8`). This file describes the API as implemented in
    `src/app/api_bridge.cpp`, `src/app/controls.cpp` and `src/api/`.

    ## Connecting and authentication
    The server listens on `http://127.0.0.1:7373` by default (settings `api.enabled`, `api.port`,
    `api.bind`, `api.tls`). Plain HTTP is only allowed on loopback; any other bind address turns TLS on
    (TLS 1.2+, self-signed certificate `api-cert.pem` in the data folder unless replaced). On first run an
    owner token with the `admin` scope is written to `api-admin-token.txt` in the data folder (mode 0600).

    Send `Authorization: Bearer <token>` on every request. Tokens look like `dh_` plus 64 hex characters and
    are never accepted in URLs. Unmatched paths also need a token (no route probing). Create narrower
    tokens with `POST /v1/tokens` or `deckhandctl token create`.

    ## Scopes
    A scope is a colon-separated path of segments `[a-z0-9_.*-]`, for example `read`, `control`,
    `control:deck:1`, `control:deck:*`. A granted scope covers a required scope when its segments are a
    prefix of the required segments and each granted segment equals the required one or is `*`. So
    `control` covers `control:deck:1` and `control:mixer`; `control:deck:*` covers every deck. `admin`
    (exactly) covers everything. Otherwise scopes imply nothing: `control` does not include `read`.
    Route scopes may use path captures (`control:deck:{deck}`); a capture used in a scope must consist of
    `[a-z0-9_.-]` or the request is rejected with 400. Each operation below states its scope in the
    `x-scope` extension and in its description.

    Scopes used: `read`, `control`, `control:deck:{n}`, `control:mixer`, `library:read`, `library:write`,
    `export`, `admin`. Tokens may also carry an expiry and a list of allowed source CIDRs (a request from
    another address gets 403).

    ## Errors
    Every error has the shape `{"error": {"code": <http status>, "message": "<text>"}}`. Status codes used
    include 400 (bad body, parameter or control), 401 (missing/invalid/expired token, with
    `WWW-Authenticate`), 403 (scope missing, origin or source address not allowed), 404, 405, 408, 409
    (valid request refused by the application state), 413 (body over 1 MiB), 429 and 500. Chunked request
    bodies are not supported (400); HEAD is not implemented.

    ## Rate limiting and lockout
    Requests (and WebSocket commands) are limited per token (100/s, burst 200) and per IP (200/s, burst
    400); excess requests get 429 with `Retry-After: 1`. Failed authentication is counted per IP; after 10
    failures within 60 s every request from that IP gets 429 (`Retry-After` set) for 60 s.

    ## Control requests and scheduling
    Control endpoints (`POST /v1/decks/{deck}/{control}`, `POST /v1/mixer/{control}`,
    `POST /v1/sampler/{slot}/{control}`, each entry of `POST /v1/commands`, and the WebSocket `control`
    command) share one body, `ControlRequest`. `value` is a number or boolean (booleans become 1/0).
    Without a value a toggle flips, a button is tapped and a trigger fires; a plain value control without a
    value is a 400. Add one of `in_ms`, `at_unix_ms` or `when` to schedule instead of executing now; the
    reply is then 202 with a `scheduled_id`. If several are given, `when` wins over the time fields and
    `at_unix_ms` wins over `in_ms`. Scheduled commands are checked every ~2 ms, so they fire within a few
    milliseconds (not yet sample-accurate). A control name is validated when the request arrives, but its
    value is only validated when it fires; a failure then is reported on the `events` WebSocket topic as a
    `scheduled` event with `ok: false`. At most 10000 commands may be pending (429 beyond that).

    ## Control names
    A control is addressed by a dotted name: `deck<1..4>.<control>`, `mixer.<control>` or
    `sampler.<1..16>.<control>`. In the REST paths the name is split: `/v1/decks/1/play` is `deck1.play`,
    `/v1/mixer/crossfader` is `mixer.crossfader`, `/v1/sampler/3/trigger` is `sampler.3.trigger`.
    `GET /v1/controls` lists every name with kind, range and help. Kinds: `trigger` (fires, value ignored),
    `toggle` (1 on, 0 off, none = flip), `button` (1 press, 0 release, none = tap), `value` (value required).

    | Deck control | Kind | Value | Purpose |
    |---|---|---|---|
    | `play` | toggle | 0 pause, 1 play | Start or pause playback |
    | `cue` | button | 1 press, 0 release | CUE button |
    | `sync` | toggle | 0/1 | Beat sync to the other deck |
    | `seek` | value | seconds from start, 0..1e9 | Move the playhead |
    | `beatjump` | value | beats, -512..512 | Jump by beats |
    | `tempo` | value | -1..1 of the tempo range | Tempo fader |
    | `tempo_range` | value | 0.01..1 (e.g. 0.06 0.10 0.16 1.0) | Tempo fader range |
    | `hotcue.<1..16>` | button | 1 press, 0 release | Hot cue pad: set if empty, else jump |
    | `hotcue_clear.<1..16>` | trigger | none | Delete a hot cue |
    | `loop_in` / `loop_out` | trigger | none | Set loop start / end and start looping |
    | `loop` | value | beats 0.03125..64 (default 4) | Toggle a loop |
    | `beatloop` | value | beats 0.03125..64 | Start a loop of this length |
    | `reloop` | trigger | none | Return to the last loop |
    | `loop_scale` | value | 0.5..2 | Halve or double the active loop |
    | `loop_move` | value | beats, -64..64 | Move the active loop |
    | `loop_exit` | trigger | none | Leave the active loop |
    | `cue_call` | value | -1 previous, 1 next | Jump to memory cue |
    | `trim` | value | 0..1 (0.5 unity) | Channel trim |
    | `eq_high` / `eq_mid` / `eq_low` | value | 0..1 (0.5 flat) | EQ |
    | `filter` | value | 0..1 (0.5 off) | Channel filter |
    | `fader` | value | 0..1 | Channel fader |
    | `pfl` | toggle | 0/1 | Headphone cue |
    | `eject` | trigger | none | Unload (refused while playing) |
    | `key_lock` | toggle | 0/1 | Keep pitch when tempo changes |
    | `key_shift` | value | semitones, -12..12 | Transpose |
    | `quantize` | toggle | 0/1 | Snap to beat grid |
    | `slip` | toggle | 0/1 | Slip mode |
    | `reverse` | toggle | 0/1 | Play backwards |
    | `color_fx` | value | 0 filter, 1 noise, 2 dub echo, 3 crush, 4 pitch, 5 space | Effect on the filter knob |
    | `auto_gain` | value | dB, -24..12 | Loudness trim |
    | `fx<1..3>.select` | value | effect number 0..Count-1 from `GET /v1/effects` (0 none; colour effects refused). Choosing an effect builds it, so it cannot be scheduled (400) | Choose effect |
    | `fx<1..3>.on` | toggle | 0/1 | Effect on |
    | `fx<1..3>.wet` / `.param` | value | 0..1 | Level / effect parameter |
    | `fx<1..3>.time` | value | beats 0.0625..16 | Beat-synced time |

    Effect chain controls (protocol 5): `<target>.chain.<verb>[.<n>]`, `<target>` = `deck1`..`deck4`, `mixer` (master),
    `mic`, `sampler` or `deckN.stemM`. Applied at once, never scheduled (400). `<id>` is a unit id from `GET /v1/fx/chains/{target}`.

    | Chain control | Kind | Value | Purpose |
    |---|---|---|---|
    | `insert` / `insert.<pos>` / `insert_on[.<pos>]` | value | effect number 1.. | Add a unit (at 0-based `pos`, default the end); `insert_on` starts it on. The reply has the new `id` |
    | `remove.<id>` | trigger | none | Remove a unit (delay and reverb tails ring out) |
    | `move.<id>` | value | new index | Move a unit |
    | `replace.<id>` | value | effect number 1.. | Replace the effect, keeping place, id and on-state |
    | `unit.on.<id>` | toggle | 0/1 | Unit on |
    | `unit.wet.<id>` / `unit.param.<id>` / `unit.param2.<id>` / `unit.param3.<id>` | value | 0..1 | Unit parameters (names in `GET /v1/effects`) |
    | `unit.beats.<id>` / `unit.seconds.<id>` | value | beats 0.0625..64 / seconds 0..60 (0 = use beats) | Unit time |
    | `bypass` / `wet` | toggle / value | 0/1 / 0..1 | Whole chain bypass / chain wet-dry |
    | `clear` | trigger | none | Remove every unit |
    | `save` | trigger | none | The reply holds the chain preset in `preset` |
    | `load` | trigger | body `text` = preset JSON | Replace the chain with a preset |

    | Mixer control | Kind | Value | Purpose |
    |---|---|---|---|
    | `crossfader` | value | 0..1 (0 left) | Crossfader |
    | `head_mix` | value | 0 cue .. 1 master | Headphone mix |
    | `head_level` / `master_level` / `sampler_level` | value | 0..1 | Levels |
    | `master_bpm` | value | 0..300 (0 follows decks) | Tempo for beat-synced effects and sampler |
    | `mic_on` / `mic_monitor` | toggle | 0/1 | Microphone channel on / also in the headphones (needs a microphone input chosen in the settings) |
    | `mic_level` | value | 0..1 (0.8 unity) | Microphone level |
    | `mic_eq_low` / `mic_eq_high` | value | 0..1 (0.5 flat, +-12 dB) | Microphone EQ |
    | `mic_talkover` | toggle | 0 off, 1 on (ducks the music while the microphone is above the threshold), 2 always duck | Talkover |
    | `mic_talkover_depth` | value | -24..0 dB | How far talkover lowers the music |
    | `mic_gate` | value | -80..-20 dB (-80 = gate off) | Microphone noise gate threshold |
    | `fx<1..3>.select/on/wet/param/time` | as deck | as deck | Master-bus effect slots |

    | Sampler control (slot 1..16) | Kind | Value | Purpose |
    |---|---|---|---|
    | `trigger` / `stop` | trigger | none | Play / stop the sample |
    | `gain` | value | 0..1 (0.8 unity) | Slot level |
    | `loop` | value | 0 one-shot, 1 loop | Loop the sample |
    | `sync` | value | 0/1 | Follow the master tempo |

    ## WebSocket protocol
    OpenAPI cannot model WebSockets, so the protocol is described here.

    **Connection.** `GET /v1/ws` with a standard WebSocket upgrade (version 13). Authenticate with
    `Authorization: Bearer <token>`, or, for browsers, with
    `Sec-WebSocket-Protocol: deckhand.v1, bearer.<token>` (list `deckhand.v1` first so the server echoes it
    and not the token). Tokens in URLs are ignored. A browser `Origin` must be on the server's allowlist
    (otherwise 403); non-browser clients send none. Failed upgrades are ordinary error responses (401, 403,
    426, 429, 503 when 64 clients are connected). Clients must mask frames and send text frames only; the
    server pings every 15 s and closes connections silent for 45 s. A message may be at most 256 KiB.
    Closing codes: 1008 token revoked or expired (checked about every 2 s), 1013 slow consumer (queue
    overflow), 1009 message too big, 1002/1003/1007 protocol errors.

    **Client messages.** `{"id": <any JSON, echoed>, "cmd": "<name>", "args": {...}}`.
    Built-in commands (no scope): `ping` (result `"pong"`), `subscribe` and `unsubscribe` with
    `args.topics`, a non-empty array (max 64) of topic patterns. Application command: `control`, scope
    `control`, with `args` equal to a `ControlRequest` plus the required string `control` holding the full
    control name, for example `{"id":1,"cmd":"control","args":{"control":"deck1.play","value":1}}`.
    Unknown commands get 404.

    **Replies.** Every message gets one reply envelope, `{"id", "ok", "status", "result" | "error"}`: `id`
    is omitted if the request had none, `ok` is true when `status < 400`, `result` carries the body for
    successes (omitted if empty) and `error` is the `{code, message}` object for failures. Examples:
    `{"id":1,"ok":true,"status":200,"result":{"control":"deck1.play"}}`;
    `{"id":2,"ok":true,"status":200,"result":{"topics":["decks","events"]}}` (the full current
    subscription list); `{"id":3,"ok":false,"status":400,"error":{"code":400,"message":"unknown deck control"}}`.
    Rate limiting replies 429 on the message. Invalid JSON gets a 400 reply without `id`.

    **Topics and published messages.** Published messages are `{"topic": "<topic>", "data": <payload>}`,
    delivered to clients subscribed to that exact topic, to `prefix.*`, or to `*`, and whose token has the
    `read` scope. Topic names are 1..128 characters from `[A-Za-z0-9._:/*-]`; at most 256 subscriptions per
    client. DeckHand publishes:

    - `decks`: array of four `Deck` objects, ten times a second (only while any client is connected).
    - `mixer`: one `Mixer` object, ten times a second.
    - `events`: discrete events, each an object with a `type`:
      `deck.loaded` and `deck.unloaded` (track changed), `deck.play` and `deck.pause`, each with
      `deck` set to a full `Deck` object; and `scheduled` with `scheduled_id`, `control`, `ok` and, on failure,
      `error`, emitted when a scheduled command fires; `stems.install` (`model`, `state` running / done / failed /
      cancelled, `progress` 0..1, `error`) and `stems.job` (`job`, `state`, `progress`, `error`) for stem separation.
servers:
  - url: http://127.0.0.1:7373
    description: Default local server (plain HTTP, loopback only)
  - url: https://{host}:{port}
    description: TLS (self-signed certificate unless replaced); required for non-loopback binds
    variables:
      host: {default: 127.0.0.1}
      port: {default: "7373"}
security:
  - bearerAuth: []
tags:
  - {name: Status}
  - {name: Decks}
  - {name: Preparation, description: Beat grid editing, cues, saved loops and hot cue names / colours of the loaded track.}
  - {name: Preview, description: Pre-listen in the headphones without loading a deck.}
  - {name: Mixer}
  - {name: Queue, description: "The persisted play queue: ordering, play next, per-entry overrides, duplicates policy, endless mode."}
  - {name: Automix, description: "Automatic transitions between queued tracks, with per-track mix points."}
  - {name: Effect chains, description: "Ordered effect units per deck, master, microphone, sampler or stem."}
  - {name: Stems, description: "Offline stem separation: models, queue and cache."}
  - {name: Controls}
  - {name: Schedule}
  - {name: Effects}
  - {name: Sampler}
  - {name: Recording}
  - {name: Library}
  - {name: History}
  - {name: Export}
  - {name: Lighting, description: "DMX lighting (Art-Net, sACN, serial) driven by the music. Off until enabled."}
  - {name: Controllers, description: Hardware controllers, their mappings and per-controller settings.}
  - {name: Settings}
  - {name: Tokens}

paths:
  /v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Application status
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: Application, audio device and track count.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
              example: {app: DeckHand, api: 1, status: "Audio running", audio_device: "Built-in Output", tracks: 1423}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks:
    get:
      tags: [Decks]
      operationId: listDecks
      summary: State of all four decks
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: Array of four decks, in order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Deck"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}:
    get:
      tags: [Decks]
      operationId: getDeck
      summary: State of one deck
      description: "Required scope: `read`. 404 if the deck is not 1..4."
      x-scope: read
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      responses:
        "200":
          description: The deck, including the loaded track when there is one.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deck"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/load:
    post:
      tags: [Decks]
      operationId: loadDeck
      summary: Load a track into a deck
      description: |
        Required scope: `control:deck:{deck}`. Give `track_id` (a library track) or `path` (an absolute file
        path, which is also added to the library; `path` wins if both are given). Loading is asynchronous:
        the reply is 202 with an empty body.
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadRequest"}
            examples:
              byId: {value: {track_id: 12}}
              byPath: {value: {path: /Users/me/Music/track.flac}}
      responses:
        "202": {description: Accepted; loading has started. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The application refused the load (for example the deck is playing or the track is unknown).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/{control}:
    post:
      tags: [Decks, Controls]
      operationId: controlDeck
      summary: Run a deck control (optionally scheduled)
      description: |
        Required scope: `control:deck:{deck}`. `{control}` is any deck control from the control-name tables
        in the API description, for example `play`, `cue`, `sync`, `seek`, `hotcue.3`, `beatloop`, `eq_low`,
        `fx1.wet`. The literal path `load` is a separate operation. Executes immediately (200) or, with a
        scheduling field, is queued (202).
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
        - name: control
          in: path
          required: true
          description: Deck control name, with its slot suffix where it takes one.
          schema:
            type: string
            pattern: '^(play|cue|sync|seek|beatjump|tempo|tempo_range|hotcue\.([1-9]|1[0-6])|hotcue_clear\.([1-9]|1[0-6])|loop_in|loop_out|loop|beatloop|reloop|loop_scale|cue_call|trim|eq_high|eq_mid|eq_low|filter|fader|pfl|eject|key_lock|key_shift|key_sync|key_sync_mode|key_match|key_reset|quantize|slip|reverse|loop_move|loop_exit|color_fx|auto_gain|metronome|grid_(edit|shift|align|first_beat|downbeat|rotate|bpm|set_bpm|scale|tap|add_section|remove_section|lock|reanalyse|undo)|memory_cue_(set|delete)|loop_(save|recall|delete)|cue_set|hotcue_(set|style|loop)\.([1-9]|1[0-6])|wave_zoom(_in|_out)?|fx[1-3]\.(select|on|wet|param|time))$'
          examples:
            play: {value: play}
            hotcue: {value: hotcue.3}
            effect: {value: fx1.wet}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlRequest"}
            examples:
              seek: {value: {value: 62.5}}
              scheduled: {value: {value: 1, when: {deck: 1, seconds: 180.0}}}
      responses:
        "200": {$ref: "#/components/responses/ControlExecuted"}
        "202": {$ref: "#/components/responses/ControlScheduled"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/grid:
    get:
      tags: [Preparation]
      operationId: getDeckGrid
      summary: Beat grid, grid lock and metronome state of the track on a deck
      description: "Required scope: `read`. 409 when no track is loaded."
      x-scope: read
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      responses:
        "200":
          description: The deck's grid sections in seconds, whether it is locked, whether edit mode is on, how many edits can be undone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeckGrid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: No track is loaded on that deck.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/grid/{action}:
    post:
      tags: [Preparation]
      operationId: editDeckGrid
      summary: Edit the beat grid of the loaded track
      description: |
        Required scope: `control:deck:{deck}`. The loaded deck uses the new grid at once (quantise, sync and loops
        follow; the playhead does not move) and the library is updated. A hand edit locks the grid so analysis never
        replaces it; `lock` with value 0 unlocks it. Actions: `edit` (value 0/1: edit mode), `shift` (value =
        milliseconds, signed), `align` (the beat nearest the playhead moves onto it), `set_first_beat`, `downbeat` (the
        beat nearest the playhead becomes bar beat 1), `rotate` (value = steps, default 1), `bpm_delta` (value = BPM
        change), `set_bpm` (value = BPM 30..300), `scale` (value 0.5 or 2), `tap` (call it in time; the tempo is set
        from the third tap), `add_section` / `remove_section` (tempo section at the playhead, or at value seconds),
        `lock` (value 0/1, none = toggle), `reanalyse` (refused while locked), `undo`.
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [edit, shift, align, set_first_beat, downbeat, rotate, bpm_delta, set_bpm, scale, tap, add_section, remove_section, lock, reanalyse, undo]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PrepRequest"}
            examples:
              shift: {value: {value: -12}}
              bpm: {value: {value: 0.01}}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PrepResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Cannot be done (no track, grid locked, nothing to undo ...).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/stems:
    get:
      tags: [Decks]
      operationId: getDeckStems
      summary: Stem playback state of a deck
      description: "Required scope: `read`. `state` is none, loading, attached or failed; `active` is true while the deck plays the stems instead of the original mix."
      x-scope: read
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      responses:
        "200":
          description: Availability and the per-stem mute, solo, isolate, level, meter (post-gain peak, 0..1) and effect flag.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Decks]
      operationId: setDeckStems
      summary: Mute, solo, level and preset the stems of a deck
      description: |
        Required scope: `control:deck:{deck}`. Every key is optional. `attach` loads the stems of the loaded track from the
        stem cache (409 when it has none), `detach` drops them, `enabled` switches between stems and the original mix,
        `preset` is acapella, instrumental, drums_only, no_drums or reset, and `stems` sets `mute`, `solo`, `isolate`
        (booleans) and `level` (0..1.5) per stem (vocals, drums, bass, other). Changes ramp over about 10 ms. The same
        state is available as controls `deckN.stem.<vocals|drums|bass|other>.<mute|solo|isolate|level>` and
        `deckN.stems.<acapella|instrumental|drums_only|no_drums|reset|enable|detach>`; effect chains of a stem use
        target `deckN.stemM` (M 1..4 are vocals, drums, bass, other).
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: The stem state after the change (same as GET).
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: No stems for the loaded track, or the engine refused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/cues:
    get:
      tags: [Preparation]
      operationId: getDeckCues
      summary: Memory cues, saved loops, hot cues (with names and colours) and the loop of the loaded track
      description: "Required scope: `read`. 409 when no track is loaded."
      x-scope: read
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      responses:
        "200":
          description: Cue lists in seconds. `color` is 0xRRGGBB as a number, -1 for the default colour.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeckCues"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: No track is loaded on that deck.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/cues/{action}:
    post:
      tags: [Preparation]
      operationId: editDeckCues
      summary: Edit cues, saved loops and hot cues of the loaded track
      description: |
        Required scope: `control:deck:{deck}`. Changes apply to the loaded deck at once and are stored in the library.
        Actions: `memory_set` (value = seconds, none = at the playhead; body text and color name it), `memory_delete`
        (body slot = the memory cue's number, none = nearest to the playhead), `memory_style` (slot, text, color),
        `memory_move` (slot, value = seconds), `loop_save` (stores the current loop), `loop_recall` (body slot = the
        saved loop's number, none = the next one), `loop_delete` (slot), `hot_set` (slot 1..16, value = seconds, none = at
        the playhead; quantised when quantise is on), `hot_style` (slot, text, color; color null clears it), `hot_loop`
        (slot; makes the hot cue a loop, again makes it plain), `hot_delete` (slot), `main_set` (value = seconds, none =
        at the playhead). `wave_zoom` (value = seconds visible, 1.5..48), `wave_zoom_in`, `wave_zoom_out` zoom the
        scrolling waveform of the deck.
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [memory_set, memory_delete, memory_style, memory_move, loop_save, loop_recall, loop_delete, hot_set, hot_style, hot_loop, hot_delete, main_set, wave_zoom, wave_zoom_in, wave_zoom_out]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PrepRequest"}
            examples:
              nameHotCue: {value: {slot: 1, text: Intro, color: 4079615}}
              memoryCue: {value: {value: 92.5, text: Drop}}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PrepResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Cannot be done (no track, no such cue, no loop ...).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/mixer:
    get:
      tags: [Mixer]
      operationId: getMixer
      summary: Mixer state
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: Mixer levels and positions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Mixer"}
        default: {$ref: "#/components/responses/Error"}

  /v1/mixer/{control}:
    post:
      tags: [Mixer, Controls]
      operationId: controlMixer
      summary: Run a mixer control (optionally scheduled)
      description: |
        Required scope: `control:mixer`. `{control}` is a mixer control: `crossfader`, `head_mix`,
        `head_level`, `master_level`, `master_bpm`, `sampler_level`, a microphone control (`mic_on`, `mic_level`,
        `mic_eq_low`, `mic_eq_high`, `mic_talkover`, `mic_talkover_depth`, `mic_monitor`, `mic_gate`), or a master-bus effect slot control
        `fx1.select`, `fx1.on`, `fx1.wet`, `fx1.param`, `fx1.time` (slots 1..3).
      x-scope: "control:mixer"
      parameters:
        - name: control
          in: path
          required: true
          schema:
            type: string
            pattern: '^(crossfader|head_mix|head_level|master_level|master_bpm|sampler_level|mic_on|mic_level|mic_eq_low|mic_eq_high|mic_talkover|mic_talkover_depth|mic_monitor|mic_gate|fx[1-3]\.(select|on|wet|param|time))$'
          example: crossfader
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlRequest"}
            example: {value: 0.5, in_ms: 500}
      responses:
        "200": {$ref: "#/components/responses/ControlExecuted"}
        "202": {$ref: "#/components/responses/ControlScheduled"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
        default: {$ref: "#/components/responses/Error"}

  /v1/controls:
    get:
      tags: [Controls]
      operationId: listControls
      summary: Every control with kind, range, help and current value
      description: |
        Required scope: `read`. Lists all deck (1..4), mixer, effect-slot and sampler controls by full name
        (several hundred entries). `value` is present only for controls whose state can be read; sampler
        controls have none.
      x-scope: read
      responses:
        "200":
          description: Control catalogue.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Control"}
              example:
                - {name: deck1.play, kind: toggle, range: "0 pause, 1 play, none = toggle", help: Start or pause playback, value: 0}
        default: {$ref: "#/components/responses/Error"}

  /v1/commands:
    post:
      tags: [Controls]
      operationId: runCommands
      summary: Run several controls in one request
      description: |
        Required scope: `control` (note: individual entries are not checked against narrower scopes such as
        `control:deck:1`, so a token needs the broad `control` scope). Each entry is a `ControlRequest` with
        a required full `control` name. Entries run in order; one failing does not stop the rest. The HTTP
        status is 200 whenever the list itself is valid; each entry reports its own `status`.
      x-scope: control
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandsRequest"}
            example:
              commands:
                - {control: deck1.play}
                - {control: mixer.crossfader, value: 1.0, in_ms: 4000}
      responses:
        "200":
          description: One result per command, in order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CommandResult"}
              example:
                - {status: 200, result: {control: deck1.play}}
                - {status: 202, result: {control: mixer.crossfader, scheduled_id: 7}}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/schedule:
    get:
      tags: [Schedule]
      operationId: listSchedule
      summary: Pending scheduled commands
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: Commands that have not fired yet.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScheduledCommand"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Schedule]
      operationId: clearSchedule
      summary: Cancel all pending scheduled commands
      description: "Required scope: `control`."
      x-scope: control
      responses:
        "204": {description: Cleared. Empty body.}
        default: {$ref: "#/components/responses/Error"}

  /v1/schedule/{id}:
    delete:
      tags: [Schedule]
      operationId: cancelScheduled
      summary: Cancel one scheduled command
      description: "Required scope: `control`."
      x-scope: control
      parameters:
        - name: id
          in: path
          required: true
          description: The `scheduled_id` returned when it was queued.
          schema: {type: integer, minimum: 1}
      responses:
        "204": {description: Cancelled. Empty body.}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/effects:
    get:
      tags: [Effects]
      operationId: listEffects
      summary: Available effects
      description: |
        Required scope: `read`. The `number` is what `fxN.select` takes. Effects flagged `colour_only` are
        the filter-knob effects (`color_fx`) and cannot be selected into a slot.
      x-scope: read
      responses:
        "200":
          description: Effect catalogue.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Effect"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fx/chains/{target}:
    get:
      tags: [Effect chains]
      operationId: getFxChain
      summary: An effect chain
      description: |
        Required scope: `read`. `target` is deck1..deck4, master, mic, sampler or deckN.stemM (M 1..8). Units are in processing order; `id` is stable for the life of the unit.
      x-scope: read
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fx/chains/{target}/units:
    post:
      tags: [Effect chains]
      operationId: insertFxUnit
      summary: Add an effect unit
      description: |
        Required scope: `control:fx:{target}` (`control` covers it). Body: `effect` (slug or number from `GET /v1/effects`), optional `pos` (0-based, default the end) and `on`. Replies 201 with the chain and the new `id`; 409 when the chain is full (8 units) or the engine refuses.
      x-scope: control:fx:{target}
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {effect: ping_pong, pos: 0, on: true}
      responses:
        "201": {description: Unit added, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fx/chains/{target}/units/{id}:
    patch:
      tags: [Effect chains]
      operationId: editFxUnit
      summary: Change an effect unit
      description: |
        Required scope: `control:fx:{target}`. Any of `on`, `wet`, `param`, `param2`, `param3` (0..1), `beats` (0.0625..64), `seconds` (0..60, 0 = use beats) and `effect` (replaces the effect, resetting the other fields first). Replies with the chain.
      x-scope: control:fx:{target}
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
        - {name: id, in: path, required: true, description: Unit id from the chain., schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {on: true, wet: 0.4, param: 0.7}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Effect chains]
      operationId: removeFxUnit
      summary: Remove an effect unit
      description: |
        Required scope: `control:fx:{target}`.
      x-scope: control:fx:{target}
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
        - {name: id, in: path, required: true, description: Unit id from the chain., schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Done.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fx/chains/{target}/units/{id}/move:
    post:
      tags: [Effect chains]
      operationId: moveFxUnit
      summary: Move an effect unit
      description: |
        Required scope: `control:fx:{target}`. Body: `pos`, the new 0-based index (clamped).
      x-scope: control:fx:{target}
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
        - {name: id, in: path, required: true, description: Unit id from the chain., schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {pos: 0}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fx/chains/{target}/settings:
    put:
      tags: [Effect chains]
      operationId: setFxChainSettings
      summary: Chain bypass and wet / dry
      description: |
        Required scope: `control:fx:{target}`. Body: `bypass` (boolean) and/or `wet` (0..1).
      x-scope: control:fx:{target}
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {bypass: false, wet: 1.0}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fx/chains/{target}/preset:
    get:
      tags: [Effect chains]
      operationId: getFxChainPreset
      summary: Save a chain as a preset
      description: |
        Required scope: `read`. Returns the preset object (version, bypass, wet and the units without ids); store it wherever you like.
      x-scope: read
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [Effect chains]
      operationId: putFxChainPreset
      summary: Replace a chain with a preset
      description: |
        Required scope: `control:fx:{target}`. The body is a preset object as `GET .../preset` returns it. Replies with the chain.
      x-scope: control:fx:{target}
      parameters:
        - {$ref: "#/components/parameters/FxTarget"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {v: 1, bypass: false, wet: 1, fx: [{type: echo, on: true, wet: 0.5, param: 0.5}]}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/keymap:
    get:
      tags: [Settings]
      operationId: getKeymap
      summary: The keyboard shortcuts in effect
      description: |
        Required scope: `read`. Every binding (chord, context, control, mode, description, whether it is a user override) and the warnings from the last load.
      x-scope: read
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [Settings]
      operationId: setKeymap
      summary: Replace the user keyboard shortcut overrides
      description: |
        Required scope: `admin`. The body is the `.dhkeys` text as a JSON string or an object with `text`; an empty text resets to the shipped defaults. Replies with the parse `warnings`; 400 when nothing could be read.
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {text: "# my shortcuts"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/status:
    get:
      tags: [Stems]
      operationId: getStemsStatus
      summary: Stem separation status
      description: |
        Required scope: `read`. `available` is false when the build has no separation runtime (`why_not` says so); then installing and queueing answer 409. The queue pauses by itself while any deck plays and resumes when all are stopped (`paused_while_playing`). Also the cache size and cap, the jobs and the running install.
      x-scope: read
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/models:
    get:
      tags: [Stems]
      operationId: listStemModels
      summary: Stem models
      description: |
        Required scope: `read`. The catalogue with the licence text of each model and whether it is installed. Show the licence before installing.
      x-scope: read
      responses:
        "200": {description: Models, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/models/{id}/install:
    post:
      tags: [Stems]
      operationId: installStemModel
      summary: Install a stem model
      description: |
        Required scope: `admin`. Body: `accept_licence: true` (without it, 400 with the licence text). Downloads, verifies and converts on a worker thread: 202 now, progress on the `events` topic (`stems.install`) and in `GET /v1/stems/status`. 409 when the build cannot separate stems, another install is running or the model cannot be installed yet.
      x-scope: admin
      parameters:
        - {name: id, in: path, required: true, description: Model id from the catalogue., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {accept_licence: true}
      responses:
        "202": {description: Started, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/models/{id}:
    delete:
      tags: [Stems]
      operationId: removeStemModel
      summary: Remove an installed stem model
      description: |
        Required scope: `admin`. Stops the queue use of the model first. Cached stems stay.
      x-scope: admin
      parameters:
        - {name: id, in: path, required: true, description: Model id from the catalogue., schema: {type: string}}
      responses:
        "204": {description: Done.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/queue:
    post:
      tags: [Stems]
      operationId: queueStems
      summary: Separate tracks in the background
      description: |
        Required scope: `library:write`. Body: `track_ids` or `playlist_id`; `force` repeats tracks that are already separated. 202 with `queued` (track and job) and `skipped` (track and reason). 409 when the build cannot separate stems or no model is installed.
      x-scope: library:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
            example: {track_ids: [12, 13]}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/queue/pause:
    post:
      tags: [Stems]
      operationId: pauseStems
      summary: Pause the stem queue
      description: |
        Required scope: `library:write`. The running chunk finishes first.
      x-scope: library:write
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/queue/resume:
    post:
      tags: [Stems]
      operationId: resumeStems
      summary: Resume the stem queue
      description: |
        Required scope: `library:write`. The queue still waits while a deck is playing.
      x-scope: library:write
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/stems/queue/{job}:
    delete:
      tags: [Stems]
      operationId: cancelStemJob
      summary: Cancel a queued or running stem job
      description: |
        Required scope: `library:write`.
      x-scope: library:write
      parameters:
        - {name: job, in: path, required: true, description: Job number., schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Done.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tracks/{id}/stems:
    get:
      tags: [Stems]
      operationId: getTrackStems
      summary: Stems of a track
      description: |
        Required scope: `library:read`. `cached` (with `bytes`, `model`) and whether a separation is `queued` or running (`job`, `state`, `progress`). Clearing the `stems` kind in `POST /v1/library/analysis/strip` evicts the cache entry.
      x-scope: library:read
      parameters:
        - {name: id, in: path, required: true, description: Track id., schema: {type: integer}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/sampler/{slot}/load:
    post:
      tags: [Sampler]
      operationId: loadSample
      summary: Load an audio file into a sampler slot
      description: "Required scope: `control`. Asynchronous; 202 with an empty body."
      x-scope: control
      parameters:
        - {$ref: "#/components/parameters/Slot"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PathRequest"}
            example: {path: /Users/me/Samples/airhorn.wav}
      responses:
        "202": {description: Accepted. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/sampler/{slot}/{control}:
    post:
      tags: [Sampler, Controls]
      operationId: controlSampler
      summary: Run a sampler control (optionally scheduled)
      description: |
        Required scope: `control`. Controls: `trigger`, `stop` (triggers), `gain` (0..1), `loop` (0 or 1),
        `sync` (0 or 1). The literal path `load` is a separate operation.
      x-scope: control
      parameters:
        - {$ref: "#/components/parameters/Slot"}
        - name: control
          in: path
          required: true
          schema: {type: string, enum: [trigger, stop, gain, loop, sync]}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlRequest"}
            example: {}
      responses:
        "200": {$ref: "#/components/responses/ControlExecuted"}
        "202": {$ref: "#/components/responses/ControlScheduled"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
        default: {$ref: "#/components/responses/Error"}

  /v1/recording:
    get:
      tags: [Recording]
      operationId: getRecording
      summary: Master recorder status
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: Recorder state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recording"}
        default: {$ref: "#/components/responses/Error"}

  /v1/recording/{action}:
    post:
      tags: [Recording]
      operationId: controlRecording
      summary: Start or stop recording the master output
      description: "Required scope: `control`. Any action other than `start` or `stop` is a 404."
      x-scope: control
      parameters:
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [start, stop]}
      responses:
        "200":
          description: The file being written (start) or just written (stop).
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Refused (for example already recording, or the file could not be opened).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks:
    get:
      tags: [Library]
      operationId: listTracks
      summary: Search and page through the library
      description: "Required scope: `library:read`."
      x-scope: "library:read"
      parameters:
        - {name: search, in: query, description: Free-text search., schema: {type: string}}
        - {name: playlist, in: query, description: Playlist id; 0 or absent means the whole library., schema: {type: integer, default: 0}}
        - name: sort
          in: query
          description: Sort key; anything else uses the default order.
          schema: {type: string, enum: [title, artist, album, genre, bpm, key, duration, rating, added]}
        - {name: desc, in: query, description: "`1` for descending order.", schema: {type: string, enum: ["0", "1"]}}
        - {name: limit, in: query, description: Page size (clamped to 1..2000)., schema: {type: integer, default: 200, minimum: 1, maximum: 2000}}
        - {name: offset, in: query, description: Items to skip., schema: {type: integer, default: 0, minimum: 0}}
      responses:
        "200":
          description: A page of tracks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrackPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Library]
      operationId: addTrackFile
      summary: Add an audio file to the library
      description: "Required scope: `library:write`. Import and analysis run asynchronously; 202 with an empty body."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PathRequest"}
            example: {path: /Users/me/Music/track.flac}
      responses:
        "202": {description: Accepted. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}:
    parameters:
      - {$ref: "#/components/parameters/TrackId"}
    get:
      tags: [Library]
      operationId: getTrack
      summary: One track with cues and beat grid
      description: "Required scope: `library:read`."
      x-scope: "library:read"
      responses:
        "200":
          description: The track.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrackDetail"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [Library]
      operationId: editTrack
      summary: Edit track tags
      description: "Required scope: `library:write`. Only the fields present (with the right type) are changed. `rating` is clamped to 0..5 and `year` to 0..9999."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrackEdit"}
            example: {genre: Techno, rating: 4}
      responses:
        "200":
          description: The track after the edit.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Track"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/history:
    parameters:
      - {$ref: "#/components/parameters/TrackId"}
    get:
      tags: [Library]
      operationId: getTrackHistory
      summary: Edit history of one track
      description: "Required scope: `library:read`. The journal of field changes, newest first; at most 200 entries are kept per track. `limit` 1..200 (default 50). Entries with source `analysis` (DeckHand's own analysis results) are left out unless `include_analysis=1`."
      x-scope: "library:read"
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: include_analysis, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        "200":
          description: The edits.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/edits:
    get:
      tags: [Library]
      operationId: listRecentEdits
      summary: Recent edits across the library
      description: "Required scope: `library:read`. Newest first; `limit` 1..500 (default 50)."
      x-scope: "library:read"
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: include_analysis, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        "200":
          description: The edits.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/edits/{id}/undo:
    parameters:
      - {name: id, in: path, required: true, description: Edit id., schema: {type: integer, format: int64, minimum: 0}}
    post:
      tags: [Library]
      operationId: undoEdit
      summary: Undo one edit
      description: "Required scope: `library:write`. Restores the old value only while the field still holds the value this edit set; otherwise 409 and nothing changes. The undo is journalled with source `undo`."
      x-scope: "library:write"
      responses:
        "200":
          description: Undone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UndoResult"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/edit-batches/{id}/undo:
    parameters:
      - {name: id, in: path, required: true, description: "Batch id (`batch_id` of an edit).", schema: {type: integer, format: int64, minimum: 0}}
    post:
      tags: [Library]
      operationId: undoEditBatch
      summary: Undo every edit of one operation
      description: "Required scope: `library:write`. All or nothing: if any field changed again since, 409 and nothing is undone."
      x-scope: "library:write"
      responses:
        "200":
          description: Undone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UndoResult"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/grid:
    parameters:
      - {name: id, in: path, required: true, description: Track id., schema: {type: integer, format: int64, minimum: 0}}
    post:
      tags: [Library]
      operationId: setTrackGrid
      summary: Replace a track's beat grid, cues following
      description: "Required scope: `library:write`. Journalled as one edit batch together with the tempo, the lock and (by `cues_follow`) the cues, so one undo restores all. Cues that sat on the old grid (within 15 ms of a beat, half or quarter beat) keep their beat position under the new grid; loops keep their length in beats; off-grid cues stay and are listed. Halving or doubling the tempo leaves positions alone. `cues_follow` ask (the default, setting `cues_follow_grid`) only proposes the moves and returns `batch_id` for the follow-grid call; always moves them now; never leaves them."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: "sections [{first_beat_ms, bpm 30-300, bar_beat 1-4}], bpm (tempo to store, default the first section's), lock (bool), cues_follow (ask|always|never), dry_run (bool). Response: batch_id, grid_changed, cues_follow, cues_applied, cues {moves, off_grid, unchanged, no_grid, tolerance_ms}."}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/cues/follow-grid:
    parameters:
      - {name: id, in: path, required: true, description: Track id., schema: {type: integer, format: int64, minimum: 0}}
    post:
      tags: [Library]
      operationId: followGrid
      summary: Move the cues of an earlier grid edit
      description: "Required scope: `library:write`. Second call of the ask flow: moves the cues for the grid edit of `batch_id`, inside that same batch (one undo restores grid and cues). 409 when already moved or when the grid was edited again since."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: "batch_id (from the grid edit). Response: batch_id, cues {moves, off_grid, unchanged}."}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/analysis/strip:
    post:
      tags: [Library]
      operationId: stripAnalysis
      summary: Clear derived analysis data for many tracks
      description: "Required scope: `library:write`. Clears only the chosen kinds (grid [with tempo], key, loudness, waveform, first_sound [load cue and first sound], phrases, vocals, stems); never tags, cues, playlists or the main cue. Locked grids are skipped unless `force`; a key set by hand is skipped unless `force`. phrases and vocals hold no data yet (no-op); stems reports not available. One edit batch: undo restores grid, tempo, key and grid lock; loudness, waveform cache and first-sound/load cue are not undoable (the next analysis re-creates them)."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: "kinds [..], and one selection: ids [..] | playlist_id and/or search | all true; force (bool), dry_run (bool). Response: counts per kind, skipped_grid_locked, skipped_user_key, notes, batch_id."}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/duplicates:
    get:
      tags: [Library]
      operationId: listDuplicates
      summary: Duplicate groups
      description: "Required scope: `library:read`. Query: mode (exact|likely|all), same_bpm=1, same_key=1, duration_ms (tolerance, default 2000), limit. exact = identical file bytes (content hash; hashes fill in via POST /v1/library/duplicates/hash, `hash_pending` says how many are left); likely = same normalised artist and title, length within the tolerance, with a confidence and the differences (format, bitrate, sample_rate, duration, size, bpm, key). `suggested_keep` and `suggestion_reason` are advice only."
      x-scope: "library:read"
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/duplicates/hash:
    post:
      tags: [Library]
      operationId: hashDuplicates
      summary: Hash a batch of files
      description: "Required scope: `library:write`. Does a bounded amount of work (file sizes first, then contents of files that share a size with another track); call until `remaining` is 0. Never runs when the library opens."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: "limit (1-500, default 50). Response: sized, hashed, missing, remaining."}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/duplicates/merge:
    post:
      tags: [Library]
      operationId: mergeDuplicates
      summary: Merge duplicate tracks into one
      description: "Required scope: `library:write`. Playlists get the kept track in place of the removed ones (never twice in one playlist); cues, loops and grid are copied where the kept track has none (`copy_cues`: missing, all, none); play history is combined; tags, rating, colour and analysis values fill where empty; the removed tracks go to the trash (restorable). Audio files are never deleted or moved. One edit batch covers tags, cues and grid; playlists, history and trash are not undone by it (restore the removed tracks from the trash instead)."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: "keep_id, remove_ids [..], options {copy_cues, fill_metadata, combine_history, dry_run}. Response: counts, fields_filled, batch_id, removed."}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/trash:
    get:
      tags: [Library]
      operationId: listTrash
      summary: Removed tracks that can still be restored
      description: "Required scope: `library:read`. Removed tracks are kept 30 days (with cues, beat grid and playlist places), then purged when the library opens."
      x-scope: "library:read"
      responses:
        "200":
          description: The removed tracks, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/TrashedTrack"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/trash/{id}/restore:
    parameters:
      - {name: id, in: path, required: true, description: Id the track had when it was removed., schema: {type: integer, format: int64, minimum: 0}}
    post:
      tags: [Library]
      operationId: restoreTrack
      summary: Restore a removed track
      description: "Required scope: `library:write`. Cues, beat grid and playlist places come back. 409 when the file has been added to the library again under another entry."
      x-scope: "library:write"
      responses:
        "200":
          description: Restored. `id` is the track's id (usually the old one).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer, format: int64}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/playlists:
    get:
      tags: [Library]
      operationId: listPlaylists
      summary: All playlists and folders
      description: "Required scope: `library:read`. A flat list; use `parent` to rebuild the tree."
      x-scope: "library:read"
      responses:
        "200":
          description: Playlist nodes.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Playlist"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Library]
      operationId: createPlaylist
      summary: Create a playlist or folder
      description: "Required scope: `library:write`."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaylistCreate"}
            example: {name: Warm-up, parent: 0, folder: false}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: integer, format: int64}
              example: {id: 5}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/playlists/{id}:
    parameters:
      - {$ref: "#/components/parameters/PlaylistId"}
    patch:
      tags: [Library]
      operationId: updatePlaylist
      summary: Rename or move a playlist
      description: "Required scope: `library:write`. Give `name` to rename, `parent` and/or `position` to move. 409 if a folder would be moved into itself."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaylistUpdate"}
            example: {name: Peak time}
      responses:
        "200": {description: Updated. Empty body.}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Cannot move a folder into itself.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Library]
      operationId: deletePlaylist
      summary: Delete a playlist or folder
      description: "Required scope: `library:write`."
      x-scope: "library:write"
      responses:
        "204": {description: Deleted. Empty body.}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/playlists/{id}/tracks:
    post:
      tags: [Library]
      operationId: addToPlaylist
      summary: Add a track to a playlist
      description: "Required scope: `library:write`. 404 if the track does not exist."
      x-scope: "library:write"
      parameters:
        - {$ref: "#/components/parameters/PlaylistId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaylistAddTrack"}
            example: {track_id: 12}
      responses:
        "201": {description: Added. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/playlists/{id}/tracks/{position}:
    delete:
      tags: [Library]
      operationId: removeFromPlaylist
      summary: Remove the entry at a position
      description: "Required scope: `library:write`. `position` is the entry's position in the playlist."
      x-scope: "library:write"
      parameters:
        - {$ref: "#/components/parameters/PlaylistId"}
        - {name: position, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        "204": {description: Removed. Empty body.}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/smart-playlists:
    get:
      tags: [Library]
      operationId: listSmartPlaylists
      summary: Smart playlists (saved rule sets) with their current track counts
      description: "Required scope: `library:read`."
      x-scope: "library:read"
      responses:
        "200":
          description: All smart playlists.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SmartPlaylist"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Library]
      operationId: createSmartPlaylist
      summary: Create a smart playlist
      description: "Required scope: `library:write`. A smart playlist is a list of rules, all or any of which a track must meet; it always shows what matches now. Exported to a USB stick as an ordinary playlist."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SmartPlaylistWrite"}
            example: {name: Warm-up house, match: all, rules: [{field: genre, text: house}, {field: bpm, min: 118, max: 124}, {field: rating, min: 3}]}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SmartPlaylist"}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/smart-playlists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Smart playlist id.
        schema: {type: integer, format: int64, minimum: 0}
    get:
      tags: [Library]
      operationId: getSmartPlaylist
      summary: One smart playlist
      description: "Required scope: `library:read`."
      x-scope: "library:read"
      responses:
        "200":
          description: The smart playlist and how many tracks match now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SmartPlaylist"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [Library]
      operationId: updateSmartPlaylist
      summary: Change a smart playlist's name, match mode or rules
      description: "Required scope: `library:write`. Fields that are not given stay as they are; `rules`, when given, replaces the whole list."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SmartPlaylistWrite"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SmartPlaylist"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Library]
      operationId: deleteSmartPlaylist
      summary: Delete a smart playlist
      description: "Required scope: `library:write`. The tracks stay in the library."
      x-scope: "library:write"
      responses:
        "204": {description: Deleted. Empty body.}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/smart-playlists/{id}/tracks:
    parameters:
      - name: id
        in: path
        required: true
        description: Smart playlist id.
        schema: {type: integer, format: int64, minimum: 0}
    get:
      tags: [Library]
      operationId: getSmartPlaylistTracks
      summary: The tracks that match a smart playlist now
      description: "Required scope: `library:read`."
      x-scope: "library:read"
      responses:
        "200":
          description: Matching tracks.
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: {type: integer}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Track"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/preview:
    get:
      tags: [Preview]
      operationId: getPreview
      summary: State of the pre-listen player
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: The pre-listen player. `headphone_output` is false on a stereo-only device, where pre-listen is refused unless the setting `preview.master` is 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preview"}
        default: {$ref: "#/components/responses/Error"}

  /v1/preview/load:
    post:
      tags: [Preview]
      operationId: loadPreview
      summary: Pre-listen to a library track
      description: |
        Required scope: `control`. Decodes the track and hands it to the pre-listen player, which plays in the headphones only
        (never on a deck, never on the master unless `preview.master` is on). A new preview replaces the old one. 409 with a
        reason when the device has no headphone output and `preview.master` is off. Loading is asynchronous (202).
      x-scope: control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id: {type: integer, format: int64}
                play: {type: boolean, default: false, description: Start playing as soon as it is loaded.}
      responses:
        "202": {description: Accepted; loading has started. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: Refused (no headphone output, unknown track).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/preview/{control}:
    post:
      tags: [Preview, Controls]
      operationId: controlPreview
      summary: Run a pre-listen control
      description: "Required scope: `control`. `play` (0 pause, 1 play, none = toggle), `stop`, `seek` (seconds), `level` (0..1), `master` (0 or 1: also on the master output; leave it off)."
      x-scope: control
      parameters:
        - name: control
          in: path
          required: true
          schema:
            type: string
            enum: [play, stop, seek, level, master]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlRequest"}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue:
    get:
      tags: [Queue]
      operationId: getQueue
      summary: The play queue
      description: "Required scope: `read`. `current` is playing now, `pending` has its transition scheduled, `upcoming` is in play order."
      x-scope: read
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Queue"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/add:
    post:
      tags: [Queue]
      operationId: addToQueue
      summary: Add tracks to the queue
      description: |
        Required scope: `control`. Name the tracks with `track_ids`, `track_id`, `playlist`, `smart_playlist` or `search`.
        `mode` end (default), next (play next: behind earlier play-next entries, before the rest) or at (+ `position`).
        `replace` / `shuffle` fill the queue from the tracks (mode end). The duplicates policy refuses tracks played
        recently or already queued unless `force` is true.
      x-scope: control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                track_ids: {type: array, items: {type: integer, format: int64}}
                track_id: {type: integer, format: int64}
                playlist: {type: integer, format: int64}
                smart_playlist: {type: integer, format: int64}
                search: {type: string}
                limit: {type: integer}
                mode: {type: string, enum: [end, next, at], default: end}
                position: {type: integer}
                replace: {type: boolean, default: false}
                shuffle: {type: boolean, default: false}
                force: {type: boolean, default: false}
      responses:
        "200":
          description: Entries created and tracks refused by the duplicates policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry_ids: {type: array, items: {type: integer, format: int64}}
                  added: {type: integer}
                  skipped: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/move:
    post:
      tags: [Queue]
      operationId: moveQueueEntry
      summary: Move an upcoming entry
      description: "Required scope: `control`. `position` is the new index among the upcoming entries."
      x-scope: control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_id, position]
              properties:
                entry_id: {type: integer, format: int64}
                position: {type: integer}
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Queue"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/entries/{id}:
    delete:
      tags: [Queue]
      operationId: removeQueueEntry
      summary: Remove an upcoming entry
      description: "Required scope: `control`."
      x-scope: control
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Removed.}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [Queue]
      operationId: updateQueueEntry
      summary: Set the automix overrides of an entry (and optionally move it)
      description: "Required scope: `control`. Keys that are missing keep their value, `null` makes one automatic again. e.g. `{\"max_play_ms\": 90000}` plays only 90 seconds of this entry."
      x-scope: control
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/AutomixPoints"}
                - type: object
                  properties:
                    position: {type: integer, description: Also move the entry to this index.}
      responses:
        "200":
          description: The entry's overrides.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry_id: {type: integer, format: int64}
                  overrides: {$ref: "#/components/schemas/AutomixPoints"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/clear:
    post:
      tags: [Queue]
      operationId: clearQueue
      summary: Empty the queue (the track playing is not touched)
      description: "Required scope: `control`."
      x-scope: control
      responses:
        "200": {description: Done.}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/shuffle:
    post:
      tags: [Queue]
      operationId: shuffleQueue
      summary: Shuffle the entries behind the play-next block
      description: "Required scope: `control`."
      x-scope: control
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Queue"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/skip:
    post:
      tags: [Queue]
      operationId: skipQueueEntry
      summary: Drop the next entry without playing it
      description: "Required scope: `control`. To start the next transition now use `POST /v1/automix/skip`."
      x-scope: control
      responses:
        "200": {description: The dropped entry.}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/back:
    post:
      tags: [Queue]
      operationId: queueBack
      summary: Go back to the previous track
      description: "Required scope: `control`. The previous track goes to the front, the one playing now behind it, and automix starts the transition at the next bar."
      x-scope: control
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Queue"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/history:
    get:
      tags: [Queue]
      operationId: getQueueHistory
      summary: What was played from the queue, newest first
      description: "Required scope: `read`."
      x-scope: read
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 500}}
      responses:
        "200":
          description: History.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        entry_id: {type: integer, format: int64}
                        track_id: {type: integer, format: int64}
                        played_at_ms: {type: integer, format: int64}
                        title: {type: string}
                        artist: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/queue/settings:
    get:
      tags: [Queue]
      operationId: getQueueSettings
      summary: Duplicates policy and endless mode
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueueSettings"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [Queue]
      operationId: updateQueueSettings
      summary: Change the duplicates policy or endless mode
      description: "Required scope: `control`. Endless mode keeps `keep` entries queued from `source` (`playlist:<id>`, `smart:<id>` or `search:<text>`)."
      x-scope: control
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QueueSettings"}
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueueSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/automix:
    get:
      tags: [Automix]
      operationId: getAutomix
      summary: Automix state
      description: "Required scope: `read`. `state` is stopped, idle, playing, armed (transition handed to the engine), transition, paused or finishing."
      x-scope: read
      responses:
        "200":
          description: State and settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomixState"}
        default: {$ref: "#/components/responses/Error"}

  /v1/automix/{action}:
    post:
      tags: [Automix]
      operationId: automixAction
      summary: Start, stop, pause, resume or skip automix
      description: |
        Required scope: `control`. start plays the queue (or carries on from what is playing); stop leaves the decks as they
        are and lets a running transition finish; pause stops new transitions from starting; skip starts the next transition
        now, on the next bar (409 when automix is not running or a transition is under way).
      x-scope: control
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, pause, resume, skip]
      responses:
        "200":
          description: State after the action.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomixState"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/automix/settings:
    get:
      tags: [Automix]
      operationId: getAutomixSettings
      summary: Automix settings
      description: "Required scope: `read`."
      x-scope: read
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomixSettings"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [Automix]
      operationId: updateAutomixSettings
      summary: Change automix settings
      description: "Required scope: `control`. Only the keys given change."
      x-scope: control
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AutomixSettings"}
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomixSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/automix:
    get:
      tags: [Automix, Library]
      operationId: getTrackAutomix
      summary: A track's automix points
      description: "Required scope: `library:read`. `null` means automatic. `effective` shows the mix-in and mix-out automix would use (without queue overrides)."
      x-scope: library:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Points.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomixPoints"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [Automix, Library]
      operationId: setTrackAutomix
      summary: Replace a track's automix points
      description: "Required scope: `library:write`. All five fields are replaced; a missing or null field is automatic again, so `{}` clears them."
      x-scope: library:write
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AutomixPoints"}
      responses:
        "200":
          description: Points.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomixPoints"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/phrases:
    get:
      tags: [Library]
      operationId: getTrackPhrases
      summary: A track's phrase sections
      description: "Required scope: `library:read`. The stored phrase analysis: sections (start/end ms and bars, energy 1..10, label with `label_confidence`, safe `kind`, `boundary_confidence`, `kick`) and the bar grid they sit on. `bars=1` adds the compact per-bar data (`bar_starts_ms`, `bar_energy`). `analysed` is false for a track that has not been analysed since phrases exist (it gets them on its next analysis)."
      x-scope: library:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: bars, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
      responses:
        "200":
          description: Phrases.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/suggestions:
    get:
      tags: [Library]
      operationId: getTrackSuggestions
      summary: What goes well after a track
      description: "Required scope: `library:read`. Ranked by a transparent score (tempo within the allowed pitch change, also half or double time; key on the wheel; energy from the phrase analysis, the seed's outro against each candidate's intro; shared genre; rating; the pairs the user played back to back before; a small boost for never-played tracks; a penalty for tracks played in this session). Each item carries its breakdown in `factors` (`id`, `points`, `value` 0..1, `detail`, `tag`), so a client can say why. The weights are the settings `suggest.w.tempo`, `key`, `energy`, `genre`, `rating`, `history`, `explore`, `recent` (points); the defaults of the other options come from `suggest.max_pitch`, `suggest.half_double`, `suggest.harmonic_only`, `suggest.exclude_queued`, `suggest.exclude_played`. Deterministic: ties go to the lower track id. Queued tracks are left out unless `exclude_queued=0`."
      x-scope: library:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
        - {name: playlist, in: query, required: false, description: "Only tracks of this playlist.", schema: {type: integer, format: int64}}
        - {name: max_pitch, in: query, required: false, description: "Largest tempo change in percent (default from the setting suggest.max_pitch, 6).", schema: {type: number, exclusiveMinimum: 0, maximum: 50}}
        - {name: half_double, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
        - {name: harmonic_only, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
        - {name: exclude_queued, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
        - {name: exclude_played, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
      responses:
        "200":
          description: The seed and the ranked suggestions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NextTracks"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/suggestions:
    get:
      tags: [Decks]
      operationId: getDeckSuggestions
      summary: What goes well after the track on a deck
      description: "Required scope: `read`. Same as `GET /v1/library/tracks/{id}/suggestions` for the track loaded on the deck. `deck` is 1 to 4, or `master` for the deck on air (the playing deck that is loudest at the master). 409 when nothing is loaded there. Ranked by a transparent score (tempo within the allowed pitch change, also half or double time; key on the wheel; energy from the phrase analysis, the seed's outro against each candidate's intro; shared genre; rating; the pairs the user played back to back before; a small boost for never-played tracks; a penalty for tracks played in this session). Each item carries its breakdown in `factors` (`id`, `points`, `value` 0..1, `detail`, `tag`), so a client can say why. The weights are the settings `suggest.w.tempo`, `key`, `energy`, `genre`, `rating`, `history`, `explore`, `recent` (points); the defaults of the other options come from `suggest.max_pitch`, `suggest.half_double`, `suggest.harmonic_only`, `suggest.exclude_queued`, `suggest.exclude_played`. Deterministic: ties go to the lower track id. Queued tracks are left out unless `exclude_queued=0`."
      x-scope: read
      parameters:
        - {name: deck, in: path, required: true, description: "1 to 4, or `master`.", schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
        - {name: playlist, in: query, required: false, description: "Only tracks of this playlist.", schema: {type: integer, format: int64}}
        - {name: max_pitch, in: query, required: false, description: "Largest tempo change in percent (default from the setting suggest.max_pitch, 6).", schema: {type: number, exclusiveMinimum: 0, maximum: 50}}
        - {name: half_double, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
        - {name: harmonic_only, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
        - {name: exclude_queued, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
        - {name: exclude_played, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
      responses:
        "200":
          description: The seed and the ranked suggestions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NextTracks"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "No track is loaded on that deck.", content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/transitions:
    get:
      tags: [Library]
      operationId: getTrackTransitions
      summary: Tracks played right after this one
      description: "Required scope: `library:read`. The transition history: how often each track followed this one in the same play session (counted when a session records consecutive plays; backfilled from the history when the library was upgraded to schema 9), and the pairs saved from preparation mode with their note, most played first."
      x-scope: library:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: The pairs.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/transitions:
    post:
      tags: [Library]
      operationId: saveTransition
      summary: Save a pair of tracks with a note
      description: "Required scope: `library:write`. Keeps the pair (`from` then `to`) in the transition history even if it was never played that way; `note` replaces an older note (500 characters at most). An existing pair keeps its play count."
      x-scope: library:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: integer, format: int64}
                to: {type: integer, format: int64}
                note: {type: string, maxLength: 500}
      responses:
        "200":
          description: The saved pair.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/cue-suggestions:
    get:
      tags: [Library]
      operationId: getTrackCueSuggestions
      summary: Suggested cues from the phrase analysis
      description: "Required scope: `library:read`. Hot-cue suggestions ranked best first (`max` 0..8, default 8; `mix_out_bars` 8, 16 or 32), plus memory-cue candidates at phrase boundaries with `memory=1`. `habit=1` biases the positions toward where this user usually cues (learned from the cued tracks that have phrases; ignored until there are enough). Nothing is written."
      x-scope: library:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: max, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 8}}
        - {name: mix_out_bars, in: query, required: false, schema: {type: integer, enum: [8, 16, 32]}}
        - {name: habit, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
        - {name: memory, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/tracks/{id}/cue-suggestions/apply:
    post:
      tags: [Library]
      operationId: applyTrackCueSuggestions
      summary: Write suggested cues into free slots
      description: "Required scope: `library:write`. Writes the top `max` hot-cue suggestions into FREE hot slots only (`memory: true` adds memory cues at the phrase boundaries); an existing cue is never moved, replaced or deleted. One journalled batch (`batch_id`, undo with `POST /v1/library/edit-batches/{id}/undo`). `dry_run` reports what would be written. `written` lists each cue with its 1-based `slot`; `skipped` says why (`no_free_slot`, `cue_exists`). A deck holding the track follows."
      x-scope: library:write
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CueSuggestionApply"}
      responses:
        "200":
          description: What was (or would be) written.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/cue-suggestions/apply:
    post:
      tags: [Library]
      operationId: applyCueSuggestionsBatch
      summary: Write suggested cues for many tracks
      description: "Required scope: `library:write`. The same as the single-track form over `ids`, or a `playlist_id` and/or `search` (at most 5000 tracks). One journal batch and one transaction cover every track; `dry_run` changes nothing. Tracks without phrases are counted in `tracks_without_phrases`."
      x-scope: library:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CueSuggestionApply"}
      responses:
        "200":
          description: Totals and the per-track detail.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/debug/windows:
    get:
      tags: [Settings]
      operationId: debugWindows
      summary: The UI's windows (debug)
      description: |
        Required scope: `admin`. The windows of the skin in use (main, detached modules, the panel window): id, name, role,
        visibility, desktop position in points, size, user scale and the window each is docked to. Answered by the UI
        thread, so it waits for the next frame (503 when none is drawn).
      x-scope: admin
      responses:
        "200":
          description: One entry per window.
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
        "503": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/debug/hit:
    get:
      tags: [Settings]
      operationId: debugHit
      summary: What a click on a window would do (debug)
      description: |
        Required scope: `admin`. Runs the same hit test the shell uses for click-through: `none` (transparent, the click falls
        through to what is behind the app), `drag`, `control` (with the widget's binding or action in `control`), `resize`
        or `solid`. `window` is a skin window id or role; `x` and `y` are points in that window.
      x-scope: admin
      parameters:
        - {name: window, in: query, required: true, schema: {type: string}}
        - {name: x, in: query, required: true, schema: {type: number}}
        - {name: y, in: query, required: true, schema: {type: number}}
      responses:
        "200":
          description: The hit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: {type: string}
                  x: {type: number}
                  y: {type: number}
                  hit: {type: string, enum: [none, drag, control, resize, solid]}
                  opaque: {type: boolean}
                  control: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/history:
    get:
      tags: [History]
      operationId: listHistory
      summary: Play-history sessions
      description: "Required scope: `library:read`."
      x-scope: "library:read"
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/HistorySession"}
        default: {$ref: "#/components/responses/Error"}

  /v1/history/{id}:
    get:
      tags: [History]
      operationId: getHistorySession
      summary: Entries of one history session
      description: "Required scope: `library:read`. An unknown but numeric session id returns an empty array."
      x-scope: "library:read"
      parameters:
        - {name: id, in: path, required: true, description: Session id., schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Played tracks.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/HistoryEntry"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/export:
    post:
      tags: [Export]
      operationId: exportLibrary
      summary: Export to a removable drive
      description: "Required scope: `export`. Asynchronous; 202 with an empty body. The outcome is in `GET /v1/export/report`: `report`, `converted`, `remaining_will_not_play`, `stem_tracks`, `no_stems[]` (tracks without usable stems), `cues_not_exported` (hot cues in slots 9-16: the stick format carries 8, the rest is left out and never fails the export), `required_bytes`, `available_bytes`, `ok`, `error`."
      x-scope: export
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExportRequest"}
            example: {destination: /Volumes/STICK, playlist_id: 3}
      responses:
        "202": {description: Accepted. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: Refused by the application (for example an export is already running).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/export/xml:
    post:
      tags: [Library]
      operationId: exportLibraryXml
      summary: Write the library as DJ library XML
      description: "Required scope: `export`. Writes the file; the response counts what was written. See docs/INTERCHANGE.md."
      x-scope: "export"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: {type: string, description: Absolute path on the machine running DeckHand.}
                playlist_id: {type: integer, format: int64, description: "0 = whole library"}
                include_playlists: {type: boolean}
                include_cues: {type: boolean}
                include_grid: {type: boolean}
      responses:
        "200":
          description: "Counts: tracks, playlists, cues, files."
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/import/xml:
    post:
      tags: [Library]
      operationId: importLibraryXml
      summary: Import a DJ library XML file
      description: "Required scope: `library:write`. All or nothing. `dry_run` does the work and rolls it back, so the counts are exact. Imported changes are journalled with source `import`; fields the user or API edited are kept unless `overwrite_metadata`."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: {type: string, description: Absolute path on the machine running DeckHand.}
                merge: {type: boolean}
                overwrite_cues: {type: boolean}
                overwrite_grid: {type: boolean}
                overwrite_metadata: {type: boolean}
                match_by_name: {type: boolean}
                import_playlists: {type: boolean}
                import_play_counts: {type: boolean}
                dry_run: {type: boolean}
      responses:
        "200":
          description: Statistics of the import.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/playlists/{id}/export/m3u8:
    parameters:
      - {$ref: "#/components/parameters/PlaylistId"}
    post:
      tags: [Library]
      operationId: exportPlaylistM3u8
      summary: Write one playlist as M3U8
      description: "Required scope: `export`. A folder id exports every playlist below it, flattened."
      x-scope: "export"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: {type: string, description: Absolute path on the machine running DeckHand.}
                relative_paths: {type: boolean}
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/export/m3u8:
    post:
      tags: [Library]
      operationId: exportAllPlaylistsM3u8
      summary: Write every playlist as M3U8 files
      description: "Required scope: `export`. One file per playlist, folders as directories."
      x-scope: "export"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                directory: {type: string, description: Absolute folder.}
                relative_paths: {type: boolean}
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/import/m3u8:
    post:
      tags: [Library]
      operationId: importPlaylistM3u8
      summary: Import an M3U8 playlist
      description: "Required scope: `library:write`. `dry_run` reports without writing."
      x-scope: "library:write"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: {type: string, description: Absolute path on the machine running DeckHand.}
                playlist_name: {type: string}
                parent: {type: integer, format: int64}
                merge: {type: boolean}
                add_missing_tracks: {type: boolean}
                dry_run: {type: boolean}
      responses:
        "200":
          description: Statistics of the import.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/export/preflight:
    post:
      tags: [Library]
      operationId: exportPreflight
      summary: Check what a club player can read, before exporting
      description: "Required scope: `export`. Give `playlist_ids` and/or `track_ids` (none = whole library) and a `profile` (default `club`). 400 for an unknown profile. The body is the compatibility report."
      x-scope: "export"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: {type: string, default: club}
                playlist_ids: {type: array, items: {type: integer, format: int64}}
                track_ids: {type: array, items: {type: integer, format: int64}}
      responses:
        "200":
          description: The report: profile, summary and one entry per track.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/export/report:
    get:
      tags: [Export]
      operationId: getExportReport
      summary: Compatibility report of the last export
      description: "Required scope: `library:read`. `report`, `converted` (tracks written as 24-bit WAV), `remaining_will_not_play`, `stem_tracks`, `no_stems[]`, `cues_not_exported`, `required_bytes`, `available_bytes`, `ok` and `error`. 404 until an export has run."
      x-scope: "library:read"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/settings/{key}:
    parameters:
      - {name: key, in: path, required: true, description: Setting name (for example `api.port`)., schema: {type: string, maxLength: 64}}
    get:
      tags: [Settings]
      operationId: getSetting
      summary: Read a setting
      description: "Required scope: `admin`. Keys containing `password` are write-only (403). Most settings take effect at the next start."
      x-scope: admin
      responses:
        "200":
          description: The setting (empty string if unset).
          content:
            application/json:
              schema:
                type: object
                required: [key, value]
                properties:
                  key: {type: string}
                  value: {type: string}
              example: {key: api.port, value: "7373"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [Settings]
      operationId: setSetting
      summary: Write a setting
      description: "Required scope: `admin`. Value must be a string of at most 4096 characters; key at most 64."
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {type: string, maxLength: 4096}
            example: {value: "7374"}
      responses:
        "204": {description: Stored. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List tokens
      description: "Required scope: `admin`. Secrets are never returned."
      x-scope: admin
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Token"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Tokens]
      operationId: createToken
      summary: Create a token
      description: "Required scope: `admin`. The secret is returned once and only its hash is stored."
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TokenCreate"}
            example: {name: stream-deck, scopes: ["read", "control:deck:*", "control:mixer"], expires: 0}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenSecret"}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tokens/{id}:
    delete:
      tags: [Tokens]
      operationId: revokeToken
      summary: Revoke a token
      description: "Required scope: `admin`. Live WebSocket connections using it are dropped within about 2 s."
      x-scope: admin
      parameters:
        - {name: id, in: path, required: true, description: Token id (16 hex characters)., schema: {type: string}}
      responses:
        "204": {description: Revoked. Empty body.}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/key_sync:
    post:
      tags: [Decks]
      operationId: deckKeySync
      summary: Key sync on, off or toggle
      description: "Required scope: `control:deck:{deck}`. Same as the deck control `key_sync`: body value 1 on, 0 off, none toggles: the deck keeps its key fitting the other deck as tempos change (sets key shift and engages key lock). The deck's `key_sync` object shows the result (no key, other deck without key, too far ...)."
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {value: {type: number}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/key_match:
    post:
      tags: [Decks]
      operationId: deckKeyMatch
      summary: Key sync once
      description: "Required scope: `control:deck:{deck}`. Same as the deck control `key_match`: shifts the deck key now to fit the other deck, once. The deck's `key_sync` object shows the result (no key, other deck without key, too far ...)."
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {value: {type: number}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/decks/{deck}/key_reset:
    post:
      tags: [Decks]
      operationId: deckKeyReset
      summary: Reset key sync
      description: "Required scope: `control:deck:{deck}`. Same as the deck control `key_reset`: key shift back to 0 and key sync off. The deck's `key_sync` object shows the result (no key, other deck without key, too far ...)."
      x-scope: "control:deck:{deck}"
      parameters:
        - {$ref: "#/components/parameters/Deck"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {value: {type: number}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/key_sync/config:
    get:
      tags: [Decks]
      operationId: getKeySyncConfig
      summary: Key sync behaviour
      description: "Required scope: `read`. `mode` (0 match the key, 1 any compatible key), `fine` (cents instead of whole semitones), `limit` (largest shift in semitones). Settings keysync.mode / keysync.fine / keysync.limit."
      x-scope: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

    put:
      tags: [Decks]
      operationId: putKeySyncConfig
      summary: Change key sync behaviour
      description: "Required scope: `control`. Any of `mode` (0 or 1), `fine` (boolean), `limit` (0..12); applied to every deck at once and kept."
      x-scope: "control"
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {mode: {type: integer}, fine: {type: boolean}, limit: {type: number}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/lighting/status:
    get:
      tags: [Lighting]
      operationId: getLightingStatus
      summary: Lighting status
      description: "Required scope: `read`. `available` is false in a build without the lighting module. Everything is off until `enabled` AND an output is enabled in the configuration; nothing is sent to the network before that."
      x-scope: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/lighting/config:
    get:
      tags: [Lighting]
      operationId: getLightingConfig
      summary: Lighting configuration
      description: "Required scope: `admin`. The whole configuration (see docs/LIGHTING.md): enabled, refresh_hz, show (master, strobe_enabled, strobe_max_hz, latency_ms, palette ...), outputs (artnet, sacn, serial; each off by default), patch, profiles. 404 in a build without the module."
      x-scope: "admin"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

    put:
      tags: [Lighting]
      operationId: putLightingConfig
      summary: Change the lighting configuration
      description: "Required scope: `admin`. A (partial) configuration: objects are merged key by key, lists and values replace. Validated (a bad patch is a 400 and changes nothing), saved to lighting.json and applied. Enabling an output starts sending to the address given."
      x-scope: "admin"
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/lighting/command:
    post:
      tags: [Lighting]
      operationId: lightingCommand
      summary: Blackout, hold, master, strobe, enable or a manual look
      description: "Required scope: `control`. {\"action\": \"blackout|hold|enable\", \"value\": 0|1} (none toggles), {\"action\": \"master\", \"value\": 0..1}, {\"action\": \"strobe\", \"enabled\": false} or {\"enabled\": true, \"max_hz\": 6} (capped at 25 and never above a quarter of the refresh rate), {\"action\": \"override\", \"scene\": \"wash|pulse|chase|colour_cycle|build_ramp|calm|blackout\", \"colour\": \"#rrggbb\", \"intensity\": 0..1, \"strobe_hz\": n}, {\"action\": \"release\"}. Returns the status."
      x-scope: "control"
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/lighting/preview:
    get:
      tags: [Lighting]
      operationId: getLightingPreview
      summary: What the lights would show
      description: "Required scope: `read`. One entry per fixture (`colour` as #rrggbb, intensity, strobe_hz, pan, tilt) and the rendered universes as hex. Empty while the show is not running."
      x-scope: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/export/verify_device:
    post:
      tags: [Export]
      operationId: verifyDevice
      summary: Check an exported stick
      description: "Required scope: `export`. Reads the stick back with the export parser and checks structure, analysis files and that every audio file exists with the recorded size. `path` is the stick; `check_audio` (default true). Never changes the stick. Returns ok, tracks, playlists, files_checked and problems."
      x-scope: "export"
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, required: [path], properties: {path: {type: string}, check_audio: {type: boolean}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/export/backup_device:
    post:
      tags: [Export]
      operationId: backupDevice
      summary: Back up the library folders of a stick
      description: "Required scope: `export`. Writes a dated, hash-verified copy of the stick library (and with `include_audio` the audio files) into DeckHand data folder, device-backups. Returns the backup folder."
      x-scope: "export"
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, required: [path], properties: {path: {type: string}, include_audio: {type: boolean}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/export/device_backups:
    get:
      tags: [Export]
      operationId: listDeviceBackups
      summary: Device backups, newest first
      description: "Required scope: `export`."
      x-scope: "export"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/export/restore_device:
    post:
      tags: [Export]
      operationId: restoreDevice
      summary: Put a device backup back on a stick
      description: "Required scope: `admin`. Never implicit: `backup` must be a folder listed by GET /v1/export/device_backups and `path` the stick. Refuses (409, nothing written) when the stick already has a library unless `force` is true, and when the backup does not verify. Only the library folders are touched; nothing is formatted."
      x-scope: "admin"
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, required: [path, backup], properties: {path: {type: string}, backup: {type: string}, force: {type: boolean}, restore_audio: {type: boolean}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/shared-playlists:
    get:
      tags: [Library]
      operationId: listSharedPlaylists
      summary: Shared playlists in a folder
      description: "Required scope: `library:read`. Query `folder`: the absolute path of a folder both libraries replicate. Each entry: shared_id, name and the participants."
      x-scope: "library:read"
      parameters:
        - {name: folder, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/playlists/{id}/share:
    post:
      tags: [Library]
      operationId: sharePlaylist
      summary: Publish a playlist to a shared folder
      description: "Required scope: `library:write`. Body `folder` (absolute, must exist) and optional `label` (the name the other side sees). Links the playlist; returns shared_id and the summary. See docs/SYNC.md."
      x-scope: "library:write"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, required: [folder], properties: {folder: {type: string}, label: {type: string}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

    delete:
      tags: [Library]
      operationId: unsharePlaylist
      summary: Stop sharing a playlist
      description: "Required scope: `library:write`. The playlist stays as it is; the files in the folder are left alone."
      x-scope: "library:write"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: OK
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/shared-playlists/{shared_id}/join:
    post:
      tags: [Library]
      operationId: joinSharedPlaylist
      summary: Subscribe to a shared playlist
      description: "Required scope: `library:write`. Creates a local playlist (under `parent_id`, default top level) from the shared one. Returns shared_id, playlist_id and the merge summary (sent_added, sent_removed, sent_moved, received, missing: entries whose track is not in this library yet)."
      x-scope: "library:write"
      parameters:
        - {name: shared_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, required: [folder], properties: {folder: {type: string}, label: {type: string}, parent_id: {type: integer, format: int64}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/library/playlists/{id}/shared-sync:
    post:
      tags: [Library]
      operationId: syncSharedPlaylist
      summary: Merge a shared playlist
      description: "Required scope: `library:write`. Sends your changes and applies theirs (per entry, last writer wins); call again whenever the folder changed. Returns the merge summary."
      x-scope: "library:write"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, required: [folder], properties: {folder: {type: string}, label: {type: string}}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/controllers:
    get:
      tags: [Controllers]
      operationId: listControllers
      summary: Connected and previously seen controllers
      description: "Required scope: `read`. For each: connected, its mapping (file, decks, pad modes, alternate pad modes, audio interface match, ticks per revolution) and its per-controller settings (jog_sensitivity, ticks_per_rev, soft_takeover, leds, mapping). The settings are the library settings under `settings_prefix` (PUT /v1/settings/{key}); they apply at the next connection."
      x-scope: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A DeckHand token (`dh_` + 64 hex characters). Each operation needs a token whose scopes cover the
        operation's `x-scope`; see the Scopes section of the API description. WebSocket clients may instead
        use the `Sec-WebSocket-Protocol: deckhand.v1, bearer.<token>` header.
  parameters:
    FxTarget:
      name: target
      in: path
      required: true
      description: Effect chain, deck1..deck4, master, mic, sampler or deckN.stemM (M 1..8).
      schema: {type: string}
    Deck:
      name: deck
      in: path
      required: true
      description: Deck number, 1..4.
      schema: {type: integer, minimum: 1, maximum: 4}
    Slot:
      name: slot
      in: path
      required: true
      description: Sampler slot, 1..16.
      schema: {type: integer, minimum: 1, maximum: 16}
    TrackId:
      name: id
      in: path
      required: true
      description: Library track id.
      schema: {type: integer, format: int64, minimum: 0}
    PlaylistId:
      name: id
      in: path
      required: true
      description: Playlist or folder id.
      schema: {type: integer, format: int64, minimum: 0}
  responses:
    Error:
      description: Error. The status is any of the codes listed in the API description; the body is always an `Error`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadRequest:
      description: Malformed JSON, missing or invalid field, unknown control or value out of range.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: {code: 400, message: "unknown deck control"}}
    NotFound:
      description: No such deck, slot, track, playlist, token or command.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: {code: 404, message: "no such deck"}}
    Forbidden:
      description: The token lacks the required scope, or the operation is not allowed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: {code: 403, message: "token lacks required scope: control:deck:2"}}
    RateLimited:
      description: Rate limit, authentication lockout, or too many scheduled commands.
      headers:
        Retry-After:
          description: Seconds to wait (not set for the scheduled-command limit).
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: {code: 429, message: "rate limit exceeded"}}
    ControlExecuted:
      description: The control was applied now.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ControlResult"}
          example: {control: deck1.play}
    ControlScheduled:
      description: The control was queued; it fires at the requested time.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ScheduledResult"}
          example: {control: deck2.play, scheduled_id: 7}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer, description: HTTP status code.}
            message: {type: string}
      example: {error: {code: 401, message: "missing bearer token"}}
    Status:
      type: object
      required: [app, api, status, audio_device, tracks]
      properties:
        app: {type: string, example: DeckHand}
        api: {type: integer, description: API major version., example: 1}
        status: {type: string, description: Human-readable application status.}
        audio_device: {type: string}
        tracks: {type: integer, description: Number of tracks in the library.}
    Track:
      type: object
      required: [id, title, artist, album, genre, key, bpm, duration_ms, rating, format, path]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        artist: {type: string}
        album: {type: string}
        genre: {type: string}
        key: {type: string, description: Musical key.}
        bpm: {type: number}
        duration_ms: {type: integer, format: int64}
        rating: {type: integer, minimum: 0, maximum: 5}
        format: {type: string, description: File format.}
        path: {type: string, description: Absolute file path.}
        comment: {type: string}
        color: {type: integer, description: "Colour tag: 0 = none, else 0xRRGGBB as a number."}
        date_added: {type: integer, format: int64, description: Unix seconds.}
        bitrate: {type: integer}
        play_count: {type: integer, description: Times the track was played (from the history).}
        last_played_ms: {type: integer, format: int64, description: Unix milliseconds of the last play; 0 = never.}
        grid_locked: {type: boolean, description: Analysis never replaces a locked beat grid; hand edits lock it.}
    Cue:
      type: object
      required: [kind, start_ms, label]
      properties:
        kind: {type: string, enum: [hot, loop, memory]}
        slot: {type: integer, minimum: 1, maximum: 16, description: Hot-cue slot; absent for memory cues.}
        start_ms: {type: number}
        end_ms: {type: number, description: Loop end; absent unless a loop.}
        label: {type: string}
    BeatSection:
      type: object
      required: [first_beat_ms, bpm, bar_beat]
      properties:
        first_beat_ms: {type: number}
        bpm: {type: number}
        bar_beat: {type: integer, description: Beat-in-bar number of the first beat.}
    TrackDetail:
      description: A `Track` plus its cues and beat grid.
      allOf:
        - {$ref: "#/components/schemas/Track"}
        - type: object
          required: [cues, beatgrid]
          properties:
            cues:
              type: array
              items: {$ref: "#/components/schemas/Cue"}
            beatgrid:
              type: array
              items: {$ref: "#/components/schemas/BeatSection"}
    TrackPage:
      type: object
      required: [total, offset, items]
      properties:
        total: {type: integer, description: Matches before paging.}
        offset: {type: integer}
        items:
          type: array
          items: {$ref: "#/components/schemas/Track"}
    TrackEdit:
      type: object
      properties:
        title: {type: string}
        artist: {type: string}
        album: {type: string}
        genre: {type: string}
        key: {type: string}
        comment: {type: string}
        rating: {type: integer, minimum: 0, maximum: 5}
        year: {type: integer, minimum: 0, maximum: 9999}
        color: {type: integer, minimum: 0, maximum: 16777215, description: "Colour tag: 0 = none, else 0xRRGGBB."}
        grid_locked: {type: boolean, description: Lock or unlock the beat grid against analysis.}
    EditRecord:
      type: object
      properties:
        id: {type: integer, format: int64}
        track_id: {type: integer, format: int64}
        batch_id: {type: integer, format: int64, description: Edits made by one operation share it.}
        field: {type: string, enum: [title, artist, album, genre, key, comment, rating, year, color, bpm, grid_locked]}
        old_value: {type: string, nullable: true, description: "The column's text form; null = empty."}
        new_value: {type: string, nullable: true}
        edited_at: {type: integer, format: int64, description: Unix seconds.}
        source: {type: string, enum: [user, api, import, sync, undo, analysis]}
    EditList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EditRecord"}
    UndoResult:
      type: object
      properties:
        applied: {type: integer, description: Fields restored.}
        batch_id: {type: integer, format: int64, description: The journal batch the undo was recorded in.}
    TrashedTrack:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        artist: {type: string}
        path: {type: string}
        deleted_at: {type: integer, format: int64, description: Unix seconds.}
    Playlist:
      type: object
      required: [id, parent, name, folder, tracks]
      properties:
        id: {type: integer, format: int64}
        parent: {type: integer, format: int64, description: Parent folder id; 0 is the top level.}
        name: {type: string}
        folder: {type: boolean}
        tracks: {type: integer, description: Number of tracks.}
    PlaylistCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        parent: {type: integer, format: int64, default: 0}
        folder: {type: boolean, default: false}
    PlaylistUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1}
        parent: {type: integer, format: int64, description: New parent folder (0 = top level).}
        position: {type: integer, description: New position among siblings; omitted or -1 = end.}
    PlaylistAddTrack:
      type: object
      required: [track_id]
      properties:
        track_id: {type: integer, format: int64}
        position: {type: integer, description: Insert position; omitted or -1 = end.}
    HistorySession:
      type: object
      required: [id, started_at_ms, entries]
      properties:
        id: {type: integer, format: int64}
        started_at_ms: {type: integer, format: int64, description: Unix milliseconds.}
        entries: {type: integer, description: Number of played tracks.}
    HistoryEntry:
      type: object
      required: [track_id, deck, title, artist, started_at_ms, played_ms]
      properties:
        track_id: {type: integer, format: int64}
        deck: {type: integer}
        title: {type: string}
        artist: {type: string}
        started_at_ms: {type: integer, format: int64, description: Unix milliseconds.}
        played_ms: {type: integer, format: int64, description: How long it was played.}
    ExportRequest:
      type: object
      required: [destination]
      properties:
        destination: {type: string, description: Absolute destination folder, e.g. a mounted drive.}
        playlist_id: {type: integer, format: int64, default: 0, description: Playlist to export; 0 = whole library (including every smart playlist).}
        smart_playlist_id: {type: integer, format: int64, default: 0, description: Smart playlist to export as an ordinary playlist of the tracks it matches now. Not together with playlist_id.}
        convert_incompatible: {type: boolean, default: false, description: "Write 32-bit and float WAV/AIFF as 24-bit WAV on the stick (the source is never changed). The result is in GET /v1/export/report."}
        player_profile: {type: string, default: club, description: Rule table of the compatibility check. Unknown = 400.}
        playlist_ids: {type: array, items: {type: integer, format: int64}, description: Several playlists. Not together with playlist_id or smart_playlist_id.}
        stem_mixes: {description: "Stems as ordinary tracks on the stick: a list of acapella, instrumental, drums, bass, other, or \"all\" (the four stems), or a bit set (1 acapella, 2 instrumental, 4 drums, 8 bass, 16 other). Absent = the export panel's choice; [] = none. Tracks without cached stems are skipped and listed in `no_stems` of the report.", oneOf: [{type: array, items: {type: string}}, {type: string}, {type: integer}]}
        stem_mixes_by_playlist: {type: object, additionalProperties: true, description: "Playlist id -> mixes (same forms as stem_mixes); overrides stem_mixes inside that playlist."}
        stem_bits: {type: integer, enum: [16, 24], default: 24, description: Bit depth of the stem tracks.}
        stems_inline: {type: boolean, default: false, description: "Place each stem track right after its parent in every playlist; false = a \"Stems\" folder mirroring the playlists."}
        stems_folder: {type: string, default: Stems, description: Name of the mirror folder.}
    PathRequest:
      type: object
      required: [path]
      properties:
        path: {type: string, description: Absolute path of an existing file.}
    LoadRequest:
      type: object
      description: Give `track_id` or `path`.
      properties:
        track_id: {type: integer, format: int64}
        path: {type: string, description: Absolute path of an existing file.}
    Fx:
      type: object
      required: [effect, on, wet, param, beats]
      properties:
        effect: {type: string, description: Effect name; empty when the slot is empty.}
        on: {type: boolean}
        wet: {type: number}
        param: {type: number}
        beats: {type: number}
    Loop:
      type: object
      required: [active, in_seconds, out_seconds]
      properties:
        active: {type: boolean}
        in_seconds: {type: [number, "null"]}
        out_seconds: {type: [number, "null"]}
    Channel:
      type: object
      required: [trim, eq_high, eq_mid, eq_low, filter, fader]
      properties:
        trim: {type: number}
        eq_high: {type: number}
        eq_mid: {type: number}
        eq_low: {type: number}
        filter: {type: number}
        fader: {type: number}
    Deck:
      type: object
      required: [deck, loaded, playing, sync, pfl, position_seconds, length_seconds, bpm, tempo, tempo_range, speed, cue_seconds, loop, hot_cues, level, key_lock, key_shift, quantize, slip, reverse, auto_gain_db, fx, channel]
      properties:
        deck: {type: integer, minimum: 1, maximum: 4}
        loaded: {type: boolean}
        playing: {type: boolean}
        sync: {type: boolean}
        pfl: {type: boolean}
        position_seconds: {type: number}
        length_seconds: {type: number}
        bpm: {type: number}
        tempo: {type: number, description: Current tempo offset as a fraction (positive = faster).}
        tempo_range: {type: number}
        speed: {type: number, description: Effective playback speed.}
        cue_seconds: {type: [number, "null"]}
        loop: {$ref: "#/components/schemas/Loop"}
        hot_cues:
          type: array
          description: Sixteen slots; null for an empty slot.
          items: {type: [number, "null"]}
          minItems: 16
          maxItems: 16
        level: {type: number, description: Output level meter.}
        key_lock: {type: boolean}
        key_shift: {type: number, description: Semitones.}
        key_sync:
          type: object
          description: "Key sync (POST /v1/decks/{deck}/key_sync). `result` is none, ok, too_far, no_own_key, no_reference_key or leader; `pitch` the semitones the deck sounds above its analysed key."
          properties:
            key: {type: [string, "null"], description: "Analysed key of the loaded track in Camelot notation, null when unknown."}
            follow: {type: boolean}
            mode: {type: integer, description: "0 match the key, 1 any compatible key."}
            fine: {type: boolean, description: Lands in cents instead of whole semitones.}
            limit: {type: number, description: Largest shift in semitones.}
            result: {type: string}
            pitch: {type: number}
        quantize: {type: boolean}
        slip: {type: boolean}
        reverse: {type: boolean}
        auto_gain_db: {type: number}
        fx:
          type: array
          description: The three effect slots.
          items: {$ref: "#/components/schemas/Fx"}
        channel: {$ref: "#/components/schemas/Channel"}
        track:
          description: Present when a library track is loaded.
          $ref: "#/components/schemas/Track"
    Mixer:
      type: object
      required: [crossfader, head_mix, head_level, master_level, peak_left, peak_right]
      properties:
        crossfader: {type: number}
        head_mix: {type: number}
        head_level: {type: number}
        master_level: {type: number}
        peak_left: {type: number}
        peak_right: {type: number}
        mic_on: {type: boolean}
        mic_present: {type: boolean, description: An input is open and feeding the microphone channel.}
        mic_level: {type: number}
        mic_peak: {type: number}
        mic_talkover: {type: integer, description: "0 off, 1 on, 2 always"}
        mic_ducking: {type: boolean}
    Control:
      type: object
      required: [name, kind, range, help]
      properties:
        name: {type: string, description: "Full control name, e.g. `deck1.hotcue.3`."}
        kind: {type: string, enum: [trigger, toggle, button, value]}
        range: {type: string, description: Human-readable value range.}
        help: {type: string}
        value: {type: number, description: Current value; absent for sampler controls.}
    Effect:
      type: object
      required: [number, name, param, beat_synced, colour_only, release]
      properties:
        number: {type: integer, description: Value for `fxN.select`.}
        name: {type: string}
        param: {type: string, description: What the `param` control does for this effect.}
        param2: {type: string, description: What `param2` does ("" = unused).}
        param3: {type: string, description: What `param3` does ("" = unused).}
        slug: {type: string, description: Stable identifier used by chain presets and the chain routes.}
        beat_synced: {type: boolean}
        colour_only: {type: boolean, description: Only usable through `color_fx`, not selectable into a slot.}
        release: {type: boolean}
    ScheduleFields:
      type: object
      description: Optional scheduling. Without any of these the control runs immediately.
      properties:
        in_ms: {type: integer, minimum: 0, description: Run this many milliseconds from now.}
        at_unix_ms: {type: integer, format: int64, description: Run at this Unix time in milliseconds.}
        when:
          type: object
          description: Run when this deck's playhead reaches `seconds`.
          required: [deck, seconds]
          properties:
            deck: {type: integer, minimum: 1, maximum: 4}
            seconds: {type: number}
    PrepRequest:
      type: object
      description: Arguments of a grid or cue action. Which fields an action reads is in the operation's description.
      properties:
        value: {type: number, description: "The amount: milliseconds, BPM, seconds, a factor, 0/1 ... (see the action)."}
        value2: {type: number}
        slot: {type: integer, minimum: 0, description: "Hot cue slot 1..16, or the 1-based number of a memory cue / saved loop."}
        text: {type: string, maxLength: 80, description: Name of a cue.}
        color: {type: [integer, "null"], minimum: 0, maximum: 16777215, description: "0xRRGGBB as a number; null = the default colour."}
    PrepResult:
      type: object
      required: [action]
      properties:
        action: {type: string}
    DeckGrid:
      type: object
      required: [track_id, grid, grid_locked, grid_edit, undo_depth, metronome]
      properties:
        track_id: {type: integer, format: int64}
        grid:
          type: array
          items:
            type: object
            required: [first_beat_s, bpm, bar_beat]
            properties:
              first_beat_s: {type: number}
              bpm: {type: number}
              bar_beat: {type: integer, minimum: 1, maximum: 4, description: Position of the section's first beat within its bar.}
        grid_locked: {type: boolean}
        grid_edit: {type: boolean}
        undo_depth: {type: integer}
        metronome: {type: boolean}
    DeckCues:
      type: object
      required: [track_id, memory_cues, hot_cues, loop]
      properties:
        track_id: {type: integer, format: int64}
        memory_cues:
          type: array
          description: Memory cues and saved loops (those have end_s), in order.
          items:
            type: object
            required: [time_s, label, color]
            properties:
              time_s: {type: number}
              end_s: {type: number}
              label: {type: string}
              color: {type: integer}
        hot_cues:
          type: array
          items:
            type: object
            required: [slot, time_s, label, color]
            properties:
              slot: {type: integer, minimum: 1, maximum: 8}
              time_s: {type: number}
              end_s: {type: number, description: Present when the hot cue is a loop.}
              label: {type: string}
              color: {type: integer}
        loop:
          type: [object, "null"]
          properties:
            in_s: {type: number}
            out_s: {type: number}
            active: {type: boolean}
    SmartRule:
      type: object
      required: [field]
      properties:
        field: {type: string, enum: [text, bpm, key, genre, rating, color, added_days, plays, playlist, missing]}
        not: {type: boolean, default: false, description: "Negates the rule: text does not contain, not in the playlist, file present, key not in the set."}
        text: {type: string, description: "text / genre: a substring; key: a list such as 8A,9A (musical names work too)."}
        min: {type: number, description: "bpm, plays: lower limit; rating: at least this many stars."}
        max: {type: number, description: "bpm, plays: upper limit (omit for none)."}
        days: {type: number, description: "added_days: added within this many days."}
        color: {type: integer, description: "color: 0xRRGGBB, 0 = no colour tag."}
        playlist_id: {type: integer, format: int64}
    SmartPlaylistWrite:
      type: object
      properties:
        name: {type: string, maxLength: 120}
        match: {type: string, enum: [all, any], description: All rules (AND) or any rule (OR).}
        rules:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/SmartRule"}
    SmartPlaylist:
      type: object
      required: [id, name, match, rules]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        match: {type: string, enum: [all, any]}
        rules:
          type: array
          items: {$ref: "#/components/schemas/SmartRule"}
        track_count: {type: integer, description: Tracks matching now (list and get only).}
    NextTracks:
      type: object
      description: The seed track and what goes well after it, best first.
      properties:
        seed: {type: object, additionalProperties: true, description: "id, title, artist, genre, key, bpm, rating, duration_ms of the track the list follows."}
        items:
          type: array
          items:
            type: object
            properties:
              track: {type: object, additionalProperties: true, description: "id, title, artist, genre, key, bpm, rating, duration_ms."}
              score: {type: number, description: "Sum of the factors' points."}
              pitch_percent: {type: number, description: "Tempo change the candidate needs to match the seed (negative = slower), after any half or double time."}
              pair_count: {type: integer, description: "Times the user played this track right after the seed."}
              reverse_count: {type: integer, description: "Times the other way round."}
              factors:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, enum: [tempo, key, energy, genre, rating, history, explore, recent]}
                    points: {type: number, description: "Contribution to the score (negative for recent)."}
                    value: {type: number, description: "The factor on its own, 0..1."}
                    detail: {type: number, description: "tempo: BPM difference to the matched tempo; energy: candidate intro minus seed outro (0..1 scale); rating: stars; history: times; recent: tracks ago."}
                    tag: {type: string, description: "tempo: direct, half or double; key: same, adjacent, relative, boost or none; genre: the shared genre; history: forward or reverse."}
    CueSuggestionApply:
      type: object
      description: Options of the apply calls; every field is optional.
      properties:
        max: {type: integer, minimum: 0, maximum: 8, description: "Hot cues to write (default 8; never more than the free slots)."}
        mix_out_bars: {type: integer, enum: [8, 16, 32], description: "How many bars the mix-out phrase must leave (default 16)."}
        habit: {type: boolean, description: "Bias toward where this user usually cues."}
        memory: {type: boolean, description: "Also write memory cues at the phrase boundaries."}
        dry_run: {type: boolean}
        ids: {type: array, items: {type: integer, format: int64}, description: "Batch form only."}
        playlist_id: {type: integer, format: int64, description: "Batch form only."}
        search: {type: string, description: "Batch form only."}
    AutomixPoints:
      type: object
      description: Every field is optional; null or missing means automatic.
      properties:
        mix_in_ms: {type: [number, "null"], description: Where the track starts playing when mixed in (default the main cue, else the analysis load cue).}
        mix_out_ms: {type: [number, "null"], description: Where the track is completely mixed out (default N bars before the last audible sound).}
        transition_beats: {type: [number, "null"], minimum: 1, maximum: 64}
        transition_type: {type: [string, "null"], enum: [crossfade, cut, fade, echo_out, null]}
        max_play_ms: {type: [number, "null"], description: Longest the track plays, counted from the mix-in.}
        effective:
          type: object
          description: GET only. What automix would use now.
          properties:
            mix_in_ms: {type: number}
            mix_out_ms: {type: number}
            mix_out_automatic: {type: boolean}
            last_sound_ms: {type: number}
    QueueEntry:
      type: object
      properties:
        entry_id: {type: integer, format: int64}
        track_id: {type: integer, format: int64}
        play_next: {type: boolean}
        overrides: {$ref: "#/components/schemas/AutomixPoints"}
        title: {type: string}
        artist: {type: string}
        duration_ms: {type: integer, format: int64}
    Queue:
      type: object
      properties:
        revision: {type: integer, format: int64}
        current: {oneOf: [{$ref: "#/components/schemas/QueueEntry"}, {type: "null"}]}
        pending: {oneOf: [{$ref: "#/components/schemas/QueueEntry"}, {type: "null"}]}
        upcoming:
          type: array
          items: {$ref: "#/components/schemas/QueueEntry"}
        duplicates: {type: string, enum: [allow, skip_recent]}
        duplicates_window: {type: integer}
    QueueSettings:
      type: object
      properties:
        duplicates: {type: string, enum: [allow, skip_recent], description: skip_recent refuses a track played within the last duplicates_window tracks or already queued.}
        duplicates_window: {type: integer, minimum: 1, maximum: 1000}
        endless:
          type: object
          properties:
            enabled: {type: boolean}
            source: {type: string, description: "playlist:<id>, smart:<id> or search:<text>"}
            keep: {type: integer, minimum: 1, maximum: 100, description: Entries kept queued.}
            order: {type: string, enum: [sequential, shuffle]}
    AutomixSettings:
      type: object
      properties:
        transition_type: {type: string, enum: [crossfade, cut, fade, echo_out]}
        unsynced_type: {type: string, enum: [cut, fade, echo_out], description: Used when the tempo gap is above max_sync_gap_pct or a track has no beat grid.}
        transition_beats: {type: number, minimum: 1, maximum: 64}
        mix_out_bars: {type: number, minimum: 0, maximum: 128, description: Default mix-out is this many bars before the last audible sound.}
        max_sync_gap_pct: {type: number, minimum: 0, maximum: 50}
        bass_swap: {type: boolean}
        override_mode: {type: string, enum: [yield, hands_off]}
        on_empty: {type: string, enum: [finish, fade]}
        fade_seconds: {type: number, minimum: 1, maximum: 60}
        endless: {$ref: "#/components/schemas/QueueSettings/properties/endless"}
    AutomixState:
      type: object
      properties:
        state: {type: string, enum: [stopped, idle, playing, armed, transition, paused, finishing]}
        running: {type: boolean}
        paused: {type: boolean}
        resume_available: {type: boolean}
        current_deck: {type: [integer, "null"]}
        next_deck: {type: [integer, "null"]}
        current_track_id: {type: [integer, "null"], format: int64}
        next_track_id: {type: [integer, "null"], format: int64}
        current_entry_id: {type: [integer, "null"], format: int64}
        next_entry_id: {type: [integer, "null"], format: int64}
        seconds_to_transition: {type: [number, "null"]}
        transition_type: {type: [string, "null"]}
        transition_beats: {type: number}
        synced: {type: boolean}
        planned_mix_out_ms: {type: [number, "null"]}
        note: {type: string}
        queue_revision: {type: integer, format: int64}
        settings: {$ref: "#/components/schemas/AutomixSettings"}
    Preview:
      type: object
      required: [loaded, playing, on_master, level, headphone_output]
      properties:
        loaded: {type: boolean}
        playing: {type: boolean}
        on_master: {type: boolean, description: Also routed to the master output (off by default).}
        level: {type: number}
        track_id: {type: [integer, "null"], format: int64}
        title: {type: [string, "null"]}
        position_seconds: {type: number}
        length_seconds: {type: number}
        headphone_output: {type: boolean, description: The device has a separate headphone pair.}
    ControlRequest:
      description: |
        Body of every control endpoint. `value` may be a number or a boolean. Omit it to flip a toggle, tap
        a button or fire a trigger.
      allOf:
        - {$ref: "#/components/schemas/ScheduleFields"}
        - type: object
          properties:
            value: {type: [number, boolean]}
    CommandEntry:
      description: A control request that carries its own full control name.
      allOf:
        - {$ref: "#/components/schemas/ControlRequest"}
        - type: object
          required: [control]
          properties:
            control: {type: string, description: "Full control name, e.g. `deck1.play`.", example: deck1.play}
    CommandsRequest:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: "#/components/schemas/CommandEntry"}
    ControlResult:
      type: object
      required: [control]
      properties:
        control: {type: string, description: Full control name.}
    ScheduledResult:
      type: object
      required: [control, scheduled_id]
      properties:
        control: {type: string}
        scheduled_id: {type: integer, format: int64}
    CommandResult:
      type: object
      required: [status, result]
      properties:
        status: {type: integer, description: HTTP-style status of this entry (200, 202, 400, 429).}
        result:
          oneOf:
            - {$ref: "#/components/schemas/ControlResult"}
            - {$ref: "#/components/schemas/ScheduledResult"}
            - {$ref: "#/components/schemas/Error"}
    ScheduledCommand:
      type: object
      required: [scheduled_id, control]
      properties:
        scheduled_id: {type: integer, format: int64}
        control: {type: string}
        value: {type: number, description: Present only if a value was given.}
        at_unix_ms: {type: integer, format: int64, description: Present for time-based commands.}
        when:
          type: object
          description: Present for playhead-triggered commands.
          required: [deck, seconds]
          properties:
            deck: {type: integer, minimum: 1, maximum: 4}
            seconds: {type: number}
    Recording:
      type: object
      required: [recording, seconds, bytes, dropped_frames]
      properties:
        recording: {type: boolean}
        seconds: {type: number}
        bytes: {type: integer, format: int64}
        dropped_frames: {type: integer, format: int64}
    Token:
      type: object
      required: [id, name, scopes, created, expires]
      properties:
        id: {type: string, description: Public identifier (16 hex characters), not secret.}
        name: {type: string}
        scopes:
          type: array
          items: {type: string, pattern: '^[a-z0-9_.*-]+(:[a-z0-9_.*-]+)*$'}
        created: {type: integer, format: int64, description: Unix seconds.}
        expires: {type: integer, format: int64, description: Unix seconds; 0 = never.}
    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string}
        scopes:
          type: array
          items: {type: string, pattern: '^[a-z0-9_.*-]+(:[a-z0-9_.*-]+)*$'}
        expires: {type: integer, format: int64, default: 0, description: Unix seconds; 0 = never.}
        cidrs:
          type: array
          description: Allowed source networks (CIDR or bare address); empty = any.
          items: {type: string}
    TokenSecret:
      type: object
      required: [id, token]
      properties:
        id: {type: string}
        token: {type: string, description: "The bearer secret (`dh_` + 64 hex). Shown once."}
    WsClientMessage:
      type: object
      description: Message a WebSocket client sends (documented in the API description; not an HTTP body).
      required: [cmd]
      properties:
        id: {description: Any JSON value; echoed in the reply.}
        cmd: {type: string, enum: [ping, subscribe, unsubscribe, control]}
        args: {type: object}
    WsReply:
      type: object
      description: Reply envelope for a WebSocket command.
      required: [ok, status]
      properties:
        id: {description: Echo of the request id; absent if none was sent.}
        ok: {type: boolean}
        status: {type: integer}
        result: {description: Present on success when there is a body.}
        error:
          type: object
          properties:
            code: {type: integer}
            message: {type: string}
    WsEvent:
      type: object
      description: Message the server publishes to subscribers.
      required: [topic, data]
      properties:
        topic: {type: string, enum: [decks, mixer, events]}
        data: {description: "`decks`: array of Deck; `mixer`: Mixer; `events`: object with a `type`."}
